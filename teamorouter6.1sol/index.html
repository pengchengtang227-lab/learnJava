<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#edf7f6">
  <title>海风骑行 · 鹈鹕的自行车</title>
  <style>
    :root { color-scheme: light; --ink: #23433f; --green: #306f5a; --sky: #edf7f6; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--sky); color: var(--ink); font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    .masthead { min-height: 100px; padding: 26px 4.5%; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 17px; }
    .brand-mark { width: 42px; height: 42px; color: var(--green); }
    .brand h1 { margin: 0 0 6px; font-size: 24px; line-height: 1.2; font-weight: 700; }
    .eyebrow { margin: 0; font-size: 10px; line-height: 1.4; color: #5e7971; letter-spacing: 0; }
    .header-note { margin: 0; font-size: 13px; color: #628178; display: flex; align-items: center; gap: 10px; }
    .header-note svg { width: 17px; height: 17px; }
    .stage { position: relative; flex: 1; min-height: 510px; }
    .scene { display: block; width: 100%; height: 100%; position: absolute; inset: 0; }
    .dock { min-height: 108px; padding: 20px 4.5% 26px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 28px; align-items: center; background: #f8fbfa; border-top: 1px solid #d9e7e0; }
    .status { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #627a71; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #39815e; box-shadow: 0 0 0 4px #e4eee8; flex-shrink: 0; }
    .app[data-paused="true"] .status-dot { background: #b49458; box-shadow: 0 0 0 4px #f2eddf; }
    .transport { display: flex; gap: 10px; align-items: center; }
    .tool { position: relative; width: 48px; height: 48px; display: grid; place-items: center; border: 1px solid #ceddd5; border-radius: 50%; background: transparent; color: var(--ink); cursor: pointer; transition: background .15s, border-color .15s; }
    .tool:hover { background: #e3eee8; border-color: #9ab7a6; }
    .tool.primary { background: var(--green); border-color: var(--green); color: white; width: 54px; height: 54px; }
    .tool.primary:hover { background: #245b47; }
    .tool svg { width: 20px; height: 20px; }
    .tool::after { content: attr(data-tooltip); pointer-events: none; position: absolute; left: 50%; bottom: calc(100% + 10px); transform: translateX(-50%); white-space: nowrap; font-size: 11px; border-radius: 5px; padding: 6px 9px; background: var(--ink); color: white; opacity: 0; transition: opacity .15s; }
    .tool:hover::after, .tool:focus-visible::after { opacity: 1; }
    button:focus-visible, input:focus-visible { outline: 3px solid #df9f47; outline-offset: 4px; }
    .speed-control { justify-self: end; display: flex; align-items: center; gap: 14px; }
    .speed-control label { font-size: 12px; color: #627a71; white-space: nowrap; }
    .speed-control output { width: 40px; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 116px; height: 24px; margin: 0; background: transparent; cursor: pointer; accent-color: var(--green); }
    input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: #cfdfd5; border-radius: 2px; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: var(--green); border: 3px solid #f8fbfa; border-radius: 50%; margin-top: -5px; box-shadow: 0 0 0 1px var(--green); }
    input[type="range"] { -webkit-appearance: none; }
    .play-icon { display: none; }
    .app[data-paused="true"] .play-icon { display: block; }
    .app[data-paused="true"] .pause-icon { display: none; }
    @media (min-height: 850px) { .stage { min-height: 620px; } }
    @media (max-width: 680px) {
      .masthead { min-height: 88px; padding: 23px 24px; }
      .brand { gap: 12px; }
      .brand h1 { font-size: 22px; }
      .brand-mark { width: 36px; height: 36px; }
      .header-note { display: none; }
      .stage { min-height: 440px; }
      .dock { min-height: 155px; padding: 18px 24px 25px; grid-template-columns: 1fr auto; gap: 15px; }
      .transport { grid-column: 2; grid-row: 1; }
      .speed-control { grid-column: 1 / -1; justify-self: stretch; gap: 15px; }
      .speed-control input { flex: 1; min-width: 0; }
      .tool { width: 42px; height: 42px; }
      .tool.primary { width: 48px; height: 48px; }
    }
  </style>
</head>

          <use href="#grass" transform="translate(1528 862) scale(1.18)"/><use href="#grass" transform="translate(2665 858) scale(1.1)"/>
          <use href="#flower" transform="translate(2694 865) scale(.95)"/><use href="#flower" transform="translate(2656 869) scale(.7)"/>
          <use href="#grass" transform="translate(-215 858) scale(1.1)"/><use href="#flower" transform="translate(-186 865) scale(.95)"/>
          <use href="#flower" transform="translate(-224 869) scale(.7)"/>
          <use href="#grass" transform="translate(-1352 862) scale(1.18)"/>
          <use href="#grass" transform="translate(748 906) scale(.7)"/><use href="#grass" transform="translate(2188 906) scale(.7)"/>
          <use href="#grass" transform="translate(-692 906) scale(.7)"/>
          <use href="#grass" transform="translate(2968 862) scale(1.18)"/><use href="#grass" transform="translate(4105 858) scale(1.1)"/>
          <use href="#flower" transform="translate(4134 865) scale(.95)"/><use href="#flower" transform="translate(4096 869) scale(.7)"/>
          <use href="#grass" transform="translate(3628 906) scale(.7)"/>
        </g>
      </svg>
    </section>

    <footer class="dock">
      <div class="status"><span class="status-dot" aria-hidden="true"></span><span id="status" role="status">骑行中</span></div>
      <div class="transport">
        <button class="tool primary" id="toggle" type="button" aria-label="暂停动画" data-tooltip="暂停" aria-pressed="false">
          <svg class="pause-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
          <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="m8 4 13 8-13 8Z"/></svg>
        </button>
        <button class="tool" id="restart" type="button" aria-label="重新播放动画" data-tooltip="重播"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.5 6.2M3 4v7h7"/></svg></button>
      </div>
      <div class="speed-control"><label for="speed">骑行速度</label><input id="speed" type="range" min="0.5" max="2" step="0.25" value="1" aria-valuetext="1 倍速度"><output id="speed-value" for="speed">1×</output></div>
    </footer>
  </main>

  <script>
    (() => {
      "use strict";
      const el = id => document.getElementById(id);
      const app = el("app");
      const scene = el("scene");
      const stage = el("stage");
      const toggle = el("toggle");
      const status = el("status");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let paused = reducedMotion.matches;
      let speed = 1;
      let time = 0;
      let lastFrame = null;
      let frameId = null;
      const nodes = Object.fromEntries([
        "near-leg-outline", "near-leg-color", "near-foot", "near-crank", "near-pedal",
        "far-leg-outline", "far-leg-color", "far-foot", "far-crank", "far-pedal",
        "rear-spokes", "front-spokes", "pelican", "tail", "scarf-tail", "pelican-head",
        "clouds-back", "clouds-front", "verge-back", "signpost", "foreground",
        "road-dashes", "sea-lines", "sailboat", "wind", "eye", "closed-eye"
      ].map(id => [id, el(id)]));

      function setTransform(id, value) { nodes[id].setAttribute("transform", value); }

      // Two-link inverse kinematics keeps each foot on its pedal and both leg lengths fixed.
      function drawLeg(side, phase, bob) {
        const hip = { x: side === "near" ? 677 : 659, y: 519 + bob };
        const foot = { x: 685 + Math.cos(phase) * 32, y: 686 + Math.sin(phase) * 32 };
        const upper = 108;
        const lower = 113;
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const outward = Math.sqrt(Math.max(0, upper * upper - along * along));
        const knee = { x: hip.x + dx * along / distance + dy * outward / distance, y: hip.y + dy * along / distance - dx * outward / distance };
        const path = `M${hip.x} ${hip.y}L${knee.x} ${knee.y}L${foot.x} ${foot.y}`;
        nodes[`${side}-leg-outline`].setAttribute("d", path);
        nodes[`${side}-leg-color`].setAttribute("d", path);
        setTransform(`${side}-foot`, `translate(${foot.x} ${foot.y - 6})`);
        nodes[`${side}-crank`].setAttribute("d", `M685 686L${foot.x} ${foot.y}`);
        nodes[`${side}-pedal`].setAttribute("d", `M${foot.x - 13} ${foot.y + 1}h30`);
      }

      function render() {
        const phase = time * 3.2 - Math.PI / 4;
        const travel = time * 164;
        const bob = Math.sin(phase * 2) * 2;
        const wheelDegrees = travel / 98 * 180 / Math.PI;
        setTransform("rear-spokes", `rotate(${wheelDegrees})`);
        setTransform("front-spokes", `rotate(${wheelDegrees})`);
        drawLeg("far", phase + Math.PI, bob);
        drawLeg("near", phase, bob);
        setTransform("pelican", `translate(0 ${bob})`);
        setTransform("tail", `rotate(${Math.sin(time * 4.5) * 2.8} 617 484)`);
        setTransform("scarf-tail", `rotate(${Math.sin(time * 5) * 4} 765 435)`);
        setTransform("pelican-head", `rotate(${Math.sin(time * 2.3) * .65} 764 393)`);
        setTransform("clouds-back", `translate(${-((time * 6) % 1640)} 0)`);
        setTransform("clouds-front", `translate(${-((time * 12) % 1640)} 0)`);
        setTransform("verge-back", `translate(${-((travel * .65) % 1410)} 0)`);
        setTransform("foreground", `translate(${-(travel % 1440)} 0)`);
        setTransform("signpost", `translate(${190 - ((travel * .65) % 1750)} 0)`);
        setTransform("sailboat", `translate(${340 - ((time * 5) % 1800)} ${492 + Math.sin(time * 1.4) * 2})`);
        nodes["road-dashes"].setAttribute("patternTransform", `translate(${-(travel % 210)} 0)`);
        nodes["sea-lines"].setAttribute("patternTransform", `translate(${-((time * 10) % 250)} 0)`);
        nodes.wind.setAttribute("opacity", .35 + Math.sin(time * 2) * .2);
        const blink = time % 5.8 > 5.59;
        nodes.eye.setAttribute("visibility", blink ? "hidden" : "visible");
        nodes["closed-eye"].setAttribute("visibility", blink ? "visible" : "hidden");
      }

      function frame(timestamp) {
        frameId = null;
        if (paused || document.hidden) { lastFrame = null; return; }
        if (lastFrame !== null) time += Math.min((timestamp - lastFrame) / 1000, .08) * speed;
        lastFrame = timestamp;
        render();
        frameId = requestAnimationFrame(frame);
      }

      function schedule() {
        if (!paused && !document.hidden && frameId === null) frameId = requestAnimationFrame(frame);
      }

      function syncPlayback() {
        app.dataset.paused = String(paused);
        toggle.setAttribute("aria-label", paused ? "播放动画" : "暂停动画");
        toggle.setAttribute("aria-pressed", String(paused));
        toggle.dataset.tooltip = paused ? "播放" : "暂停";
        status.textContent = paused ? "已暂停" : "骑行中";
        lastFrame = null;
        if (paused && frameId !== null) { cancelAnimationFrame(frameId); frameId = null; }
        schedule();
      }

      function fitScene() {
        const bounds = stage.getBoundingClientRect();
        if (!bounds.width || !bounds.height) return;
        const ratio = bounds.width / bounds.height;
        const width = ratio < 1.1 ? 760 : Math.max(1440, ratio * 700);
        const height = width / ratio;
        const centerX = ratio < 1.1 ? 760 : 720;
        const left = centerX - width / 2;
        const top = 540 - height / 2;
        scene.setAttribute("viewBox", `${left} ${top} ${width} ${height}`);
        el("sun").setAttribute("transform", `translate(${Math.min(1170, left + width - 115) - 1170} ${Math.max(145, top + 105) - 145})`);
      }

      toggle.addEventListener("click", () => { paused = !paused; syncPlayback(); });
      el("restart").addEventListener("click", () => { time = 0; render(); paused = false; syncPlayback(); });
      el("speed").addEventListener("input", event => {
        speed = Number(event.target.value);
        const label = `${speed}×`;
        el("speed-value").textContent = label;
        event.target.setAttribute("aria-valuetext", `${speed} 倍速度`);
      });
      document.addEventListener("visibilitychange", () => {
        lastFrame = null;
        if (document.hidden && frameId !== null) { cancelAnimationFrame(frameId); frameId = null; }
        schedule();
      });
      reducedMotion.addEventListener("change", event => { if (event.matches) { paused = true; syncPlayback(); } });
      new ResizeObserver(fitScene).observe(stage);
      fitScene();
      render();
      syncPlayback();
    })();
  </script>
</body>
</html>

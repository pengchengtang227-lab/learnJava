<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f3e9">
  <title>沿海慢骑 · 鹈鹕的好天气</title>
  <style>
    :root { color-scheme: light; --paper: #f6f3e9; --ink: #243e39; --muted: #718078; --line: #dcded2; --accent: #36786b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: var(--paper); color: var(--ink); font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
    main { width: min(1160px, calc(100% - 64px)); margin: 0 auto; padding: 34px 0 24px; }
    header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
    .brand svg { width: 28px; height: 28px; }
    .edition { color: var(--muted); font-size: 11px; letter-spacing: 2px; }
    .intro { display: flex; justify-content: space-between; align-items: end; gap: 20px; padding: 30px 0 25px; }
    .eyebrow { margin: 0 0 10px; font-size: 10px; letter-spacing: 3px; color: var(--accent); font-weight: 700; }
    h1 { margin: 0; font-size: clamp(25px, 3.5vw, 42px); font-weight: 600; letter-spacing: 2px; line-height: 1.45; }
    .intro-note { margin: 0 0 6px; font-size: 12px; line-height: 1.9; color: var(--muted); text-align: right; }
    .scene { position: relative; overflow: hidden; border-radius: 20px; background: #d4e8df; border: 1px solid #bfcfc2; }
    .scene > svg { display: block; width: 100%; height: auto; }
    .scene-label { position: absolute; left: 26px; top: 23px; display: flex; align-items: center; gap: 8px; font-size: 10px; letter-spacing: 2px; color: #3c6d64; pointer-events: none; }
    .scene-label::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: #408b72; }
    .scene-tag { position: absolute; bottom: 19px; right: 25px; color: #4c695b; font-size: 9px; letter-spacing: 2px; pointer-events: none; }
    .controls { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 22px 0; }
    .playback { display: flex; align-items: center; gap: 14px; }
    button { font: inherit; cursor: pointer; }
    #play { display: flex; align-items: center; justify-content: center; gap: 9px; min-width: 111px; height: 42px; padding: 0 20px; background: var(--ink); color: #fffdf1; border: 0; border-radius: 99px; font-size: 12px; }
    #play svg { width: 13px; height: 13px; }
    #play:hover { background: #36786b; }
    .hint { color: var(--muted); font-size: 10px; letter-spacing: .4px; }
    .speed-control { display: flex; align-items: center; gap: 13px; font-size: 11px; color: var(--muted); }
    input[type="range"] { width: 128px; accent-color: var(--accent); cursor: pointer; }
    output { color: var(--ink); min-width: 33px; font-variant-numeric: tabular-nums; }
    button:focus-visible, input:focus-visible { outline: 3px solid #c98c46; outline-offset: 4px; }
    footer { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 17px; font-size: 10px; color: var(--muted); letter-spacing: 1px; }
    .footer-right { letter-spacing: 2px; }
    @media (max-width: 650px) {
      main { width: calc(100% - 28px); padding-top: 22px; }
      header { padding-bottom: 18px; }
      .edition { font-size: 9px; letter-spacing: 1px; }
      .intro { padding: 26px 0 20px; display: block; }
      .intro-note { text-align: left; margin: 10px 0 0; }
      .intro-note br { display: none; }
      .scene { border-radius: 14px; }
      .scene-label { left: 14px; top: 14px; font-size: 8px; letter-spacing: 1px; }
      .scene-tag { bottom: 12px; right: 14px; font-size: 7px; letter-spacing: 1px; }
      .controls { gap: 12px; padding: 19px 0; }
      .hint { display: none; }
      #play { min-width: 91px; padding: 0 13px; height: 38px; }
      input[type="range"] { width: 84px; }
      .speed-control { gap: 8px; }
      footer { font-size: 9px; letter-spacing: .3px; }
      .footer-right { letter-spacing: 1px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="14.5" stroke="currentColor"/><path d="M7 19c4-6 7-9 11-9 2 0 3 2 3 4l7 1-8 2c-2 5-8 5-13 2Z" fill="currentColor"/><circle cx="19" cy="12.7" r=".8" fill="#f6f3e9"/></svg>
        <span>PELICAN COAST</span>
      </div>
      <span class="edition">小小出逃 · VOL. 01</span>
    </header>
    <div class="intro">
      <div><p class="eyebrow">A LITTLE COASTAL ESCAPE</p><h1>把日子，骑慢一点。</h1></div>

          <path d="M484 396Q484 387 497 387h43q13 1 13 9-25 6-69 0Z" fill="#6a5442" stroke="#4c4a37" stroke-width="2"/>
          <path d="M670 416 656 365Q652 350 666 345l29-7" fill="none" stroke="#526f5f" stroke-width="7"/>
          <path d="M678 342 701 337" fill="none" stroke="#554c3d" stroke-width="10"/>
          <circle cx="674" cy="337" r="7" fill="#dbbd74" stroke="#687e5c" stroke-width="2"/>
          <path d="M442 529 566 499q26 21 0 44l-124-14" fill="none" stroke="#6d7c59" stroke-width="2.5"/>
          <circle cx="566" cy="521" r="23" fill="#8aa186" stroke="#3b6153" stroke-width="3"/>

    <div class="controls">
      <div class="playback">
        <button id="play" type="button" aria-label="暂停动画" aria-pressed="false"><svg viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><path id="play-icon" d="M3 2h3v10H3zm5 0h3v10H8z"/></svg><span id="play-label">暂停一下</span></button>

      </div>
      <label class="speed-control" for="speed">骑行速度 <input id="speed" type="range" min="0.5" max="1.8" step="0.1" value="1" aria-label="骑行速度"><output id="speed-value" for="speed">1.0×</output></label>
    </div>
    <footer><span>今日宜：吹海风，发会儿呆。</span><span class="footer-right">TAKE THE SCENIC ROUTE ↗</span></footer>
  </main>
  <script>
    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const parts = Object.fromEntries(['rear-wheel', 'front-wheel', 'crank', 'far-leg-path', 'near-leg-path', 'near-leg-highlight', 'far-foot', 'near-foot', 'pelican', 'scarf-tail', 'clouds', 'sea-lines', 'road-lines', 'flowers', 'sailboat', 'gulls', 'wind', 'eye-open', 'eye-closed'].map(id => [id, byId(id)]));
      const play = byId('play');
      const speed = byId('speed');
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !reduceMotion.matches;
      let elapsed = 0;
      let previous = null;
      let frame = 0;
      const crankCenter = { x: 566, y: 521 };
      const crankRadius = 29;

      // 两节腿的逆运动学：膝盖由髋部与踏板位置求得，脚不会脱离踏板。
      function legPath(hip, foot) {
        const upper = 93, lower = 97;
        const dx = foot.x - hip.x, dy = foot.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const ux = dx / distance, uy = dy / distance;
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const height = Math.sqrt(Math.max(0, upper * upper - along * along));
        const knee = { x: hip.x + along * ux + height * uy, y: hip.y + along * uy - height * ux };
        return `M${hip.x.toFixed(2)} ${hip.y.toFixed(2)}L${knee.x.toFixed(2)} ${knee.y.toFixed(2)}L${foot.x.toFixed(2)} ${foot.y.toFixed(2)}`;
      }

      function draw(time) {
        const phase = time * 2.65;
        const degrees = phase * 180 / Math.PI;
        const bob = Math.sin(phase * 2) * 2.1;
        const hip = { x: 542, y: 361 + bob };
        const nearFoot = { x: crankCenter.x + crankRadius * Math.cos(phase), y: crankCenter.y + crankRadius * Math.sin(phase) };
        const farFoot = { x: crankCenter.x - crankRadius * Math.cos(phase), y: crankCenter.y - crankRadius * Math.sin(phase) };
        const path = legPath(hip, nearFoot);
        parts['near-leg-path'].setAttribute('d', path);
        parts['near-leg-highlight'].setAttribute('d', path);
        parts['far-leg-path'].setAttribute('d', legPath({ x: 537, y: 362 + bob }, farFoot));
        parts['near-foot'].setAttribute('transform', `translate(${nearFoot.x} ${nearFoot.y})`);
        parts['far-foot'].setAttribute('transform', `translate(${farFoot.x} ${farFoot.y})`);
        parts.crank.setAttribute('transform', `rotate(${degrees} 566 521)`);
        // 虚拟行进距离用于轮胎滚动与路面移动，二者采用同一速度。
        const travel = time * 116;
        const wheelDegrees = travel / 99 * 180 / Math.PI;
        parts['rear-wheel'].setAttribute('transform', `rotate(${wheelDegrees})`);
        parts['front-wheel'].setAttribute('transform', `rotate(${wheelDegrees})`);
        parts.pelican.setAttribute('transform', `translate(0 ${bob})`);
        parts['scarf-tail'].setAttribute('transform', `rotate(${Math.sin(phase * 1.4) * 3.5} 583 286)`);
        parts.clouds.setAttribute('transform', `translate(${-((time * 8) % 1200)} 0)`);
        parts['sea-lines'].setAttribute('patternTransform', `translate(${-((time * 26) % 260)} 0)`);
        parts['road-lines'].setAttribute('patternTransform', `translate(${-travel % 180} 0)`);
        parts.flowers.setAttribute('patternTransform', `translate(${-travel % 440} 0)`);
        parts.sailboat.setAttribute('transform', `translate(${1038 + Math.sin(time * .2) * 12} ${407 + Math.sin(time * 1.3) * 1.6})`);
        parts.gulls.setAttribute('transform', `translate(${Math.sin(time * .24) * 17} ${Math.sin(time * .7) * 3})`);
        parts.wind.setAttribute('opacity', (.36 + Math.sin(time * 2) * .15).toFixed(2));
        const blink = time % 5.7 > 5.49;
        parts['eye-open'].setAttribute('visibility', blink ? 'hidden' : 'visible');
        parts['eye-closed'].setAttribute('visibility', blink ? 'visible' : 'hidden');
      }

      function syncButton() {
        play.setAttribute('aria-pressed', String(!playing));
        play.setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        byId('play-label').textContent = playing ? '暂停一下' : '继续骑行';
        byId('play-icon').setAttribute('d', playing ? 'M3 2h3v10H3zm5 0h3v10H8z' : 'M3 1.5 12 7 3 12.5Z');
      }

      function tick(now) {
        if (!playing || document.hidden) { frame = 0; previous = null; return; }
        if (previous !== null) elapsed += Math.min((now - previous) / 1000, .05) * Number(speed.value);
        previous = now;
        draw(elapsed);
        frame = requestAnimationFrame(tick);
      }

      function schedule() {
        if (playing && !document.hidden && !frame) { previous = null; frame = requestAnimationFrame(tick); }
      }

      function setPlaying(value) {
        playing = value;
        if (!playing && frame) { cancelAnimationFrame(frame); frame = 0; previous = null; }
        syncButton();
        schedule();
      }

      play.addEventListener('click', () => setPlaying(!playing));
      speed.addEventListener('input', () => { byId('speed-value').value = `${Number(speed.value).toFixed(1)}×`; });
      document.addEventListener('keydown', event => {
        if (event.code !== 'Space' || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.target.closest('button, input, textarea, select, [contenteditable="true"]')) return;
        event.preventDefault();
        setPlaying(!playing);
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && frame) { cancelAnimationFrame(frame); frame = 0; previous = null; }
        else schedule();
      });
      reduceMotion.addEventListener('change', event => { if (event.matches) setPlaying(false); });
      draw(0);
      syncButton();
      schedule();
    })();
  </script>
</body>
</html>

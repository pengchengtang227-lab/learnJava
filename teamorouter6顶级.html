<script>
'use strict';
(() => {
  const $ = id => document.getElementById(id);
  const ids = ['stage','scene','play','speed','speed-value','status','status-sub','badge-text','weather','weather-text','bell','announcement','rear-wheel','front-wheel','pelican-body','eye','closed-eye','scarf-back','scarf-front','near-leg-outline','near-leg-color','far-leg-outline','far-leg-color','near-foot','far-foot','near-pedal','far-pedal','near-crank','far-crank','cloud-a','cloud-b','cloud-c','boat','waves','lighthouse','road-texture','back-grass','plant-a','plant-b','plant-c','sun','bike-shadow','bell-rings','bell-art','bird-a','bird-b','wind-lines'];
  const el = Object.fromEntries(ids.map(id => [id, $(id)]));
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const state = {time:0,speed:1,playing:!reducedMotion.matches,last:null,raf:0,bellAge:10,sunset:0,sunsetTarget:0};
  const TAU = Math.PI * 2;
  const wrap = (x,min,max) => ((x-min) % (max-min) + max-min) % (max-min) + min;
  const f = n => n.toFixed(3);
  let audioContext;

  function updateLayout(){
    const mobile = window.matchMedia('(max-width:760px)').matches;
    el.scene.setAttribute('viewBox', mobile ? '290 0 654.48 606' : '0 0 1200 606');
    el.scene.setAttribute('preserveAspectRatio', mobile ? 'xMidYMid meet' : 'xMidYMid slice');
  }
  function setTransform(node,value){node.setAttribute('transform',value);}
  function knee(hip,ankle,upper,lower,bend){
    const dx=ankle.x-hip.x,dy=ankle.y-hip.y,raw=Math.hypot(dx,dy);
    const d=Math.max(.0001,Math.min(raw,upper+lower-.001));
    const a=(upper*upper-lower*lower+d*d)/(2*d);
    const h=Math.sqrt(Math.max(0,upper*upper-a*a));
    return {x:hip.x+a*dx/raw-bend*h*dy/raw,y:hip.y+a*dy/raw+bend*h*dx/raw};
  }
  function drawLeg(side,angle,bob){
    const hip={x:side==='near'?572:552,y:315+bob};
    const ankle={x:611+36*Math.cos(angle),y:445+36*Math.sin(angle)};
    const k=knee(hip,ankle,91,93,-1);
    const d='M'+f(hip.x)+' '+f(hip.y)+' L'+f(k.x)+' '+f(k.y)+' L'+f(ankle.x)+' '+f(ankle.y);
    el[side+'-leg-outline'].setAttribute('d',d);el[side+'-leg-color'].setAttribute('d',d);
    setTransform(el[side+'-foot'],'translate('+f(ankle.x)+' '+f(ankle.y-4)+')');
    if(side==='near'){
      setTransform(el['near-pedal'],'translate('+f(ankle.x)+' '+f(ankle.y)+')');
      el['near-crank'].setAttribute('d','M611 445 L'+f(ankle.x)+' '+f(ankle.y));
    }else{
      setTransform(el['far-pedal'],'translate('+f(ankle.x)+' '+f(ankle.y)+')');
      el['far-crank'].setAttribute('d','M0 0 L'+f(611-ankle.x)+' '+f(445-ankle.y));
    }
  }
  function render(){
    const t=state.time,a=t*TAU*.56,bob=Math.sin(a*2)*1.7;
    // Match the wheel rim speed to the moving road (154 SVG units per second).
    const turn=t*154/91*180/Math.PI;
    setTransform(el['rear-wheel'],'rotate('+f(turn%360)+')');setTransform(el['front-wheel'],'rotate('+f(turn%360)+')');
    setTransform(el['pelican-body'],'translate(0 '+f(bob)+')');drawLeg('far',a+Math.PI,bob);drawLeg('near',a,bob);
    const flap=Math.sin(t*5.6),flap2=Math.sin(t*5.6-1.3);
    el['scarf-back'].setAttribute('d','M612 208 Q559 '+f(215+flap*9)+' 516 '+f(196+flap2*9)+' L505 '+f(213+flap2*7)+' Q561 '+f(234+flap*7)+' 613 220Z');
    el['scarf-front'].setAttribute('d','M611 210 Q568 '+f(227+flap2*6)+' 530 '+f(214+flap*8)+' L522 '+f(231+flap*6)+' Q572 '+f(239+flap2*4)+' 612 223Z');
    const blink=t%6.4,eyeScale=blink>5.95&&blink<6.14?Math.max(.04,Math.abs(blink-6.045)/.095):1;
    setTransform(el.eye,'translate(656 123) scale(1 '+f(eyeScale)+')');el['closed-eye'].setAttribute('opacity',eyeScale<.2?'1':'0');
    setTransform(el['cloud-a'],'translate('+f(wrap(244-t*5,-130,1390))+' 119) scale(1.08)');setTransform(el['cloud-b'],'translate('+f(wrap(688-t*3,-130,1390))+' 71) scale(.68)');setTransform(el['cloud-c'],'translate('+f(wrap(1072-t*7,-130,1390))+' 205) scale(.56)');
    setTransform(el.boat,'translate('+f(wrap(1000-t*4,-80,1380))+' '+f(353+Math.sin(t*1.1)*1.5)+') rotate('+f(Math.sin(t*.9)*1.3)+')');setTransform(el.lighthouse,'translate('+f(wrap(139-t*2,-120,1600))+' 236)');
    setTransform(el.waves,'translate('+f(-(t*13)%100)+' 0)');setTransform(el['road-texture'],'translate('+f(-(t*154)%170)+' 0)');setTransform(el['back-grass'],'translate('+f(-(t*61)%260)+' 0)');
    setTransform(el['plant-a'],'translate('+f(wrap(130-t*154,-150,1520))+' 570)');setTransform(el['plant-b'],'translate('+f(wrap(1050-t*154,-150,1520))+' 574) scale(.8)');setTransform(el['plant-c'],'translate('+f(wrap(712-t*154,-150,1520))+' 592) scale(.7)');
    const wing=Math.sin(t*3);el['bird-a'].setAttribute('d','M400 '+f(163+wing)+'q8 '+f(-8-wing)+' 16 0q8 '+f(-8-wing)+' 16 0');el['bird-b'].setAttribute('d','M443 '+f(144-wing*.6)+'q6 '+f(-6+wing*.6)+' 12 0q6 '+f(-6+wing*.6)+' 12 0');el['wind-lines'].setAttribute('opacity',f(.42+.18*Math.sin(t*2)));
    setTransform(el.sun,'translate(0 '+f(state.sunset*66)+')');const ringVisible=state.bellAge<1.1;el['bell-rings'].setAttribute('opacity',ringVisible?f(Math.max(0,1-state.bellAge/1.1)):'0');setTransform(el['bell-rings'],'translate('+f(Math.min(state.bellAge,1.1)*12)+' 0)');setTransform(el['bell-art'],'translate(720 289) rotate('+(ringVisible?f(Math.sin(state.bellAge*58)*7*(1-state.bellAge/1.1)):'0')+')');
  }
  function tick(now){
    state.raf=0;const dt=state.last===null?0:Math.min((now-state.last)/1000,.06);state.last=now;
    if(state.playing)state.time+=dt*state.speed;state.bellAge+=dt;
    if(reducedMotion.matches)state.sunset=state.sunsetTarget;else state.sunset+=(state.sunsetTarget-state.sunset)*Math.min(1,dt*6);if(Math.abs(state.sunset-state.sunsetTarget)<.001)state.sunset=state.sunsetTarget;
    render();if(state.playing||state.bellAge<1.1||state.sunset!==state.sunsetTarget)state.raf=requestAnimationFrame(tick);else state.last=null;
  }
  function wake(){if(!state.raf&&!document.hidden){state.last=null;state.raf=requestAnimationFrame(tick);}}
  function syncPlayback(){el.play.setAttribute('aria-pressed',String(state.playing));el.play.setAttribute('aria-label',state.playing?'暂停动画':'播放动画');el.stage.classList.toggle('is-paused',!state.playing);el.status.textContent=state.playing?'兜风进行中':'停一下，看看海';el['status-sub'].textContent=state.playing?'TAKE THE SCENIC ROUTE':'A LITTLE MOMENT OF PEACE';el['badge-text'].textContent=state.playing?'海风正好 · 正在兜风':'歇一小会 · 已暂停';}
  function togglePlay(){state.playing=!state.playing;syncPlayback();wake();}
  el.play.addEventListener('click',togglePlay);
  el.speed.addEventListener('input',()=>{state.speed=Number(el.speed.value);el['speed-value'].textContent=state.speed.toFixed(1)+'×';el.speed.setAttribute('aria-valuetext',state.speed.toFixed(1)+' 倍速');el.speed.style.setProperty('--progress',((state.speed-.5)/1.5*100)+'%');});
  el.weather.addEventListener('click',()=>{const evening=el.stage.classList.toggle('evening');state.sunsetTarget=evening?1:0;el.weather.setAttribute('aria-pressed',String(evening));el.weather.setAttribute('aria-label',evening?'切换到晴朗午后':'切换到黄昏场景');el['weather-text'].textContent=evening?'温柔黄昏':'晴朗午后';wake();});
  async function ringBell(){state.bellAge=reducedMotion.matches?1.1:0;el.announcement.textContent='叮铃！借过一下，好心情来了。';wake();try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;audioContext??=new Audio();if(audioContext.state==='suspended')await audioContext.resume();const start=audioContext.currentTime;[0,.16].forEach(delay=>[1800,2860,3970].forEach((frequency,index)=>{const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type='sine';osc.frequency.setValueAtTime(frequency,start+delay);gain.gain.setValueAtTime(0,start+delay);gain.gain.linearRampToValueAtTime(.065/(index+1),start+delay+.006);gain.gain.exponentialRampToValueAtTime(.0001,start+delay+.85);osc.connect(gain);gain.connect(audioContext.destination);osc.start(start+delay);osc.stop(start+delay+.9);osc.onended=()=>{osc.disconnect();gain.disconnect();};}));}catch(_){} }
  el.bell.addEventListener('click',ringBell);
  document.addEventListener('keydown',event=>{if(event.repeat||event.ctrlKey||event.metaKey||event.altKey||event.target.closest('input,button,textarea,select,[contenteditable="true"]'))return;if(event.code==='Space'){event.preventDefault();togglePlay();}if(event.code==='KeyB'){event.preventDefault();ringBell();}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(state.raf);state.raf=0;state.last=null;}else wake();});
  reducedMotion.addEventListener('change',event=>{if(event.matches){state.playing=false;syncPlayback();wake();}});
  window.addEventListener('resize',updateLayout,{passive:true});updateLayout();syncPlayback();render();wake();
})();
</script>

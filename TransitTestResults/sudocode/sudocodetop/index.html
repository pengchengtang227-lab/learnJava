<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <style>
    :root { --paper:#f5f2e9; --ink:#203f3b; --muted:#79877b; --line:#d9dfd1; --orange:#e57d4f; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
    button { font:inherit; }
    button:focus-visible { outline:3px solid #eaa45b; outline-offset:5px; }
    .page { max-width:1320px; margin:auto; padding:30px 48px 24px; }
    .masthead { display:flex; align-items:center; justify-content:space-between; padding-bottom:25px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:11px; }
    .brand-icon { width:43px; height:43px; }
    .brand-name { font-size:15px; font-weight:800; letter-spacing:2px; }
    .brand-sub { margin-top:4px; font-size:9px; letter-spacing:2.6px; }
    .edition { font-size:11px; letter-spacing:2px; display:flex; align-items:center; gap:12px; }
    .edition:before { content:""; width:7px; height:7px; border-radius:50%; background:var(--orange); }
    .intro { display:flex; justify-content:space-between; align-items:flex-end; padding:35px 0 28px; gap:24px; }
    .eyebrow { margin:0 0 13px; font-size:10px; letter-spacing:3px; color:#7c8b79; font-weight:600; }
    h1 { margin:0; font-family:"STKaiti","KaiTi","Songti SC",serif; font-weight:500; font-size:clamp(30px,3.5vw,46px); letter-spacing:3px; line-height:1.25; }
    .intro-note { margin:0 0 3px; font-size:12px; line-height:2; letter-spacing:1px; color:#758273; text-align:right; }
    .postcard { position:relative; overflow:hidden; border-radius:20px; border:1px solid #bacfc1; background:#cce6df; isolation:isolate; }
    .scene { display:block; width:100%; height:auto; }
    .scene-label { position:absolute; top:23px; left:26px; display:flex; align-items:center; gap:8px; padding:9px 13px; border:1px solid #ffffff91; border-radius:30px; background:#f8f7edab; backdrop-filter:blur(6px); font-size:10px; letter-spacing:2px; }
    .scene-label svg { width:12px; height:12px; }
    .weather { position:absolute; right:27px; top:26px; display:flex; align-items:center; gap:9px; font-size:11px; letter-spacing:1px; color:#4b7769; }
    .weather svg { width:19px; height:19px; }
    .scene-mark { position:absolute; bottom:18px; right:24px; color:#708e78; font-family:monospace; font-size:9px; letter-spacing:2px; }
    .controls { padding:21px 2px; display:flex; justify-content:space-between; align-items:center; gap:20px; border-bottom:1px solid var(--line); }
    .status { display:flex; align-items:center; gap:11px; font-size:12px; letter-spacing:1px; }
    .status-dot { width:7px; height:7px; background:#759879; border-radius:50%; box-shadow:0 0 0 5px #75987913; }
    .status.paused .status-dot { background:#c3a16f; }
    .status small { color:#8b9686; font-size:10px; margin-left:9px; }
    .buttons { display:flex; align-items:center; gap:10px; }
    .button { border:1px solid #cdd6c7; background:transparent; color:var(--ink); border-radius:30px; display:flex; align-items:center; justify-content:center; gap:8px; padding:10px 16px; font-size:11px; cursor:pointer; transition:background .2s,transform .2s; white-space:nowrap; }
    .button:hover { background:#e6ebdf; transform:translateY(-1px); }
    .button svg { width:14px; height:14px; }
    .button.primary { background:var(--ink); border-color:var(--ink); color:var(--paper); min-width:88px; }
    .button.primary:hover { background:#36594e; }
    .button.bell { padding:10px; width:36px; height:36px; }
    .footer { display:flex; justify-content:space-between; align-items:center; padding-top:22px; gap:12px; color:#87917e; font-size:10px; letter-spacing:1px; }
    .footer .quote { font-size:11px; letter-spacing:2px; }
    .footer-right { display:flex; align-items:center; gap:10px; font-family:monospace; letter-spacing:1.5px; }
    .footer-right:before { content:""; display:block; width:22px; height:1px; background:#aab6a0; }
    .bell-bubble { position:absolute; left:64%; top:27%; padding:7px 15px; color:#34594d; background:#fffdf2; border:1px solid #e1cfa5; border-radius:18px 18px 18px 2px; opacity:0; transform:translateY(8px) rotate(-8deg); pointer-events:none; font-size:15px; font-weight:700; }
    .bell-bubble.ringing { animation:ring-message 1.5s ease-out both; }
    @keyframes ring-message { 0% { opacity:0; transform:translateY(8px) rotate(-8deg); } 15%,65% { opacity:1; transform:translateY(0) rotate(-8deg); } 100% { opacity:0; transform:translateY(-16px) rotate(-4deg); } }
    @media(min-width:1600px) { .page { padding-top:46px; } .intro { padding-top:45px; padding-bottom:34px; } }
    @media(max-width:700px) { .page { padding:22px 18px; } .masthead { padding-bottom:19px; } .brand-name { font-size:13px; } .brand-sub { font-size:8px; letter-spacing:1.8px; } .edition { font-size:9px; letter-spacing:1px; } .intro { padding:27px 0 23px; display:block; } .intro-note { margin-top:15px; text-align:left; font-size:11px; } .intro-note br { display:none; } .scene { width:145%; max-width:none; margin-left:-22%; } .scene-label { top:14px; left:13px; font-size:8px; padding:7px 10px; letter-spacing:1px; } .weather { right:14px; top:16px; font-size:10px; } .scene-mark { font-size:7px; right:15px; bottom:12px; } .controls { flex-wrap:wrap; gap:17px; padding:20px 0; } .buttons { margin-left:auto; } .status small { display:none; } .footer { align-items:flex-start; font-size:8px; } .footer .quote { font-size:10px; letter-spacing:.5px; } .footer-right { font-size:8px; letter-spacing:.5px; } }
    @media(prefers-reduced-motion:reduce) { .button { transition:none; } .bell-bubble.ringing { animation:none; } }
  </style>
</head>

    </section>

    <section class="controls" aria-label="动画控制">
      <div id="status" class="status"><span class="status-dot"></span><span id="status-text" aria-live="polite">正在享受海风</span><small>不赶路，感受路。</small></div>
      <div class="buttons">
        <button id="bell-button" class="button bell" type="button" aria-label="按响自行车铃" title="叮铃，借过一下"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 12a6 6 0 0 1 12 0v2H4ZM2 14h16M8 17h4M10 4V2m6 3 2-2"/></svg></button>
        <button id="speed-button" class="button" type="button" aria-label="切换骑行速度，当前 1 倍速"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 15a8 8 0 1 1 16 0M10 12l4-6"/><circle cx="10" cy="12" r="1.4"/></svg><span id="speed-text">悠闲 · 1×</span></button>
        <button id="play-button" class="button primary" type="button" aria-label="暂停动画" aria-pressed="false"><svg id="play-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 3h3v10H4Zm5 0h3v10H9Z"/></svg><span id="play-text">暂停</span></button>
      </div>
    </section>
    <footer class="footer"><span class="quote">没有目的地，也是一种方向。</span><span class="footer-right">TAKE IT SLOW. ENJOY THE RIDE.</span></footer>
  </main>

  <script>
    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !motionPreference.matches;
      let speedIndex = 1;
      let elapsed = 0;
      let lastTime = null;
      let frameId = null;
      let audioContext;
      let bubbleTimer;
      const speeds = [0.65, 1, 1.5];
      const speedLabels = ['兜风 · 0.65×', '悠闲 · 1×', '追风 · 1.5×'];
      const nodes = Object.fromEntries([
        'cyclist', 'rear-spokes', 'front-spokes', 'near-leg', 'near-leg-outline',
        'far-leg', 'far-leg-outline', 'near-foot', 'far-foot', 'crank', 'scarf-tail',
        'waves', 'road-marks', 'sand-specks', 'cloud-a', 'cloud-b', 'cloud-c',
        'grass-back', 'grass-front-a', 'grass-front-b', 'gulls', 'sailboat',
        'bike-shadow', 'breeze-lines'
      ].map(id => [id, byId(id)]));
      const set = (id, attribute, value) => nodes[id].setAttribute(attribute, value);
      const wrap = (value, range) => ((value % range) + range) % range;

      // Solve a two-segment leg, keeping each webbed foot exactly on its pedal.
      function legPath(hipX, hipY, footX, footY) {
        const upper = 103;
        const lower = 108;
        const dx = footX - hipX;
        const dy = footY - hipY;
        const distance = Math.max(Math.hypot(dx, dy), 0.001);
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hipX + along * dx / distance + bend * dy / distance;
        const kneeY = hipY + along * dy / distance - bend * dx / distance;
        return `M${hipX} ${hipY}L${kneeX.toFixed(2)} ${kneeY.toFixed(2)}L${footX.toFixed(2)} ${footY.toFixed(2)}`;
      }

      function draw(time) {
        const travel = time * 155;
        const crankAngle = time * 3.4;
        const rotation = travel / 87 * 180 / Math.PI;
        const bob = Math.sin(crankAngle * 2) * 1.2;
        set('cyclist', 'transform', `translate(0 ${bob})`);
        set('rear-spokes', 'transform', `rotate(${rotation % 360})`);
        set('front-spokes', 'transform', `rotate(${rotation % 360})`);
        const footX = 572 + Math.cos(crankAngle) * 34;
        const footY = 483 + Math.sin(crankAngle) * 34;
        const backX = 1144 - footX;
        const backY = 966 - footY;
        const nearLeg = legPath(512, 332, footX, footY);
        const farLeg = legPath(531, 333, backX, backY);
        set('near-leg', 'd', nearLeg);
        set('near-leg-outline', 'd', nearLeg);
        set('far-leg', 'd', farLeg);
        set('far-leg-outline', 'd', farLeg);
        set('near-foot', 'transform', `translate(${footX} ${footY})`);
        set('far-foot', 'transform', `translate(${backX} ${backY})`);
        set('crank', 'd', `M${backX} ${backY}L${footX} ${footY}`);
        const flutter = Math.sin(time * 5.2) * 5;
        set('scarf-tail', 'd', `M553 223C525 ${225 + flutter} 511 ${208 + flutter} 482 ${212 + flutter}l10 12-17 8c33 9 51 ${-flutter} 78 ${4 - flutter}Z`);
        set('waves', 'patternTransform', `translate(${-travel * 0.12 % 176} 0)`);
        set('road-marks', 'patternTransform', `translate(${-travel % 180} 0)`);
        set('sand-specks', 'patternTransform', `translate(${-travel * 1.15 % 125} 0)`);
        set('cloud-a', 'transform', `translate(${wrap(340 - time * 9, 1500) - 150} 111)`);
        set('cloud-b', 'transform', `translate(${wrap(910 - time * 6, 1500) - 150} 76) scale(.65)`);
        set('cloud-c', 'transform', `translate(${wrap(1245 - time * 12, 1500) - 150} 224) scale(.85)`);
        set('grass-back', 'transform', `translate(${wrap(170 - travel * .6, 1340) - 60} 467)`);
        set('grass-front-a', 'transform', `translate(${wrap(125 - travel * 1.15, 1340) - 60} 637)`);
        set('grass-front-b', 'transform', `translate(${wrap(1070 - travel * 1.15, 1340) - 60} 640)`);
        set('gulls', 'transform', `translate(${Math.sin(time * .22) * 24} ${Math.sin(time * 1.5) * 3})`);
        set('sailboat', 'transform', `translate(${212 + Math.sin(time * .15) * 25} ${384 + Math.sin(time * 1.8) * 1.2})`);
        set('bike-shadow', 'rx', 230 + bob * 2);
        set('breeze-lines', 'opacity', .3 + Math.sin(time * 3) * .12);
      }

      function tick(now) {
        frameId = null;
        if (!playing || document.hidden) return;
        if (lastTime !== null) elapsed += Math.min((now - lastTime) / 1000, .06) * speeds[speedIndex];
        lastTime = now;
        draw(elapsed);
        frameId = requestAnimationFrame(tick);
      }

      function syncPlayback() {
        byId('play-text').textContent = playing ? '暂停' : '继续';
        byId('play-button').setAttribute('aria-label', playing ? '暂停动画' : '继续动画');
        byId('play-button').setAttribute('aria-pressed', String(!playing));
        byId('play-icon').innerHTML = playing
          ? '<path d="M4 3h3v10H4Zm5 0h3v10H9Z"/>'
          : '<path d="m5 2 9 6-9 6Z"/>';
        byId('status-text').textContent = playing ? '正在享受海风' : '停一会儿，看看海';
        byId('status').classList.toggle('paused', !playing);
        if (frameId !== null) cancelAnimationFrame(frameId);
        frameId = null;
        lastTime = null;
        if (playing && !document.hidden) frameId = requestAnimationFrame(tick);
      }

      byId('play-button').addEventListener('click', () => { playing = !playing; syncPlayback(); });
      byId('speed-button').addEventListener('click', () => {
        speedIndex = (speedIndex + 1) % speeds.length;
        byId('speed-text').textContent = speedLabels[speedIndex];
        byId('speed-button').setAttribute('aria-label', `切换骑行速度，当前 ${speeds[speedIndex]} 倍速`);
      });
      byId('bell-button').addEventListener('click', async () => {
        const bubble = byId('bell-bubble');
        clearTimeout(bubbleTimer);
        bubble.classList.remove('ringing');
        void bubble.offsetWidth;
        bubble.classList.add('ringing');
        bubbleTimer = setTimeout(() => bubble.classList.remove('ringing'), 1600);
        const AudioEngine = window.AudioContext || window.webkitAudioContext;
        if (!AudioEngine) return;
        try {
          audioContext ||= new AudioEngine();
          if (audioContext.state === 'suspended') await audioContext.resume();
          const start = audioContext.currentTime;
          [0, .16].forEach((delay, index) => {
            [1, 2.73].forEach((harmonic, overtone) => {
              const oscillator = audioContext.createOscillator();
              const gain = audioContext.createGain();
              oscillator.type = 'sine';
              oscillator.frequency.value = (index ? 1568 : 2093) * harmonic;
              gain.gain.setValueAtTime(0, start + delay);
              gain.gain.linearRampToValueAtTime(overtone ? .022 : .09, start + delay + .004);
              gain.gain.exponentialRampToValueAtTime(.0001, start + delay + .7);
              oscillator.connect(gain);
              gain.connect(audioContext.destination);
              oscillator.start(start + delay);
              oscillator.stop(start + delay + .75);
              oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
            });
          });
        } catch { /* The visual bell remains available if browser audio is unavailable. */ }
      });
      document.addEventListener('visibilitychange', syncPlayback);
      motionPreference.addEventListener('change', event => {
        if (event.matches) { playing = false; syncPlayback(); }
      });
      draw(0);
      syncPlayback();
    })();
  </script>
</body>
</html>

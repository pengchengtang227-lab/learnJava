<style>

          <g id="crank" transform="translate(660 516)"><circle r="23" fill="#f2ead1" stroke="#62735a" stroke-width="3"/><circle r="17" fill="none" stroke="#c2c8aa" stroke-width="2"/><g id="crank-arms" stroke="#43554b" stroke-width="5" stroke-linecap="round"><path d="M-36 0h72"/><path d="M-36 0h72" stroke="#a9b59c" stroke-width="2"/></g><circle r="7" fill="#88a68c" stroke="#43554b" stroke-width="2"/><circle r="2" fill="#43554b"/></g>
          <path id="near-leg" d="M644 416 719 462 696 516" fill="none" stroke="#43554b" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/><path id="near-leg-color" d="M644 416 719 462 696 516" fill="none" stroke="#e7ad6c" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
          <g id="near-foot" transform="translate(696 516)"><rect x="-21" y="3" width="43" height="6" rx="3" fill="#43554b"/><path class="outline" d="M-17-10q5-5 13-1l19 6q17 6 3 11h-29q-12-1-6-16Z" fill="#edb170" stroke-width="2.3"/><path d="m5-3 5 7m-14-9 4 9" fill="none" stroke="#c58a52" stroke-width="1.5"/></g>
          <!-- 白色羽毛、长嘴和大喉囊让主角清晰可辨为鹈鹕。 -->
          <g id="rider-body">
            <path class="outline" d="m584 356-52-23 19 26-27 9 52 22Z" fill="#dce4d3"/><path d="m545 349 25 15m-31 4 29 10" stroke="#97aa90" stroke-width="2" stroke-linecap="round"/>
            <path class="outline" d="M562 352c9-39 50-64 87-51 13 5 21 15 23 32 12-4 25-27 20-50l-8-30c-11-34 5-62 31-63 29-2 52 20 42 46-6 15-25 23-35 37-10 14 4 32 12 47 23 41 10 73-16 93-28 23-67 26-108 13-38-11-64-36-48-74Z" fill="url(#feather-gradient)"/>
            <path d="M625 421q61 17 91-19 26-29 11-64m-55-5q-6 27-27 35" fill="none" stroke="#cbd6c2" stroke-width="9" stroke-linecap="round" opacity=".65"/><path d="M711 270q-11 20 3 43" fill="none" stroke="#e5e8d9" stroke-width="7" stroke-linecap="round"/>
            <path class="outline" d="M696 195q-17-4-21-21 14 1 22 11-1-14 6-19 8 11 7 24" fill="#fffdf2" stroke-width="2.5"/><path d="M693 211q5-9 16-9" fill="none" stroke="#e1e5d3" stroke-width="3" stroke-linecap="round"/>
            <path class="outline" d="m751 235 181 15c-33 45-74 62-112 49-47-16-65-41-69-64Z" fill="url(#pouch-gradient)" stroke-width="2.5"/><path d="M765 253q31 42 72 44" fill="none" stroke="#f7cb90" stroke-width="3" stroke-linecap="round"/>
            <path class="outline" d="M751 217q90 6 181 25 16 4 9 14l-14-3-171-13Z" fill="#f1c27d" stroke-width="2.6"/><path d="m765 227 158 20" fill="none" stroke="#ffe0a6" stroke-width="2" stroke-linecap="round"/><path d="M929 244q6 3 5 9" fill="none" stroke="#b67d44" stroke-width="2" stroke-linecap="round"/>
            <g id="eye" transform="translate(741 211)"><circle r="8.5" fill="#efe9cb"/><circle r="4.5" fill="#344e44"/><circle cx="1.4" cy="-1.6" r="1.5" fill="#fffdf0"/></g>
            <path d="M733 197q7-4 12 0" fill="none" stroke="#7b8c72" stroke-width="2" stroke-linecap="round"/><ellipse cx="727" cy="235" rx="9" ry="5" fill="#e9b796" opacity=".55"/>
            <g id="scarf-tail" transform="translate(701 295)"><path class="outline" d="M0-7q-25-3-46-14-17-8-34-2l8 8-13 4q23-2 41 10L-3 7Z" fill="#d9956b" stroke="#a77f59" stroke-width="2"/><path d="M-13-3q-30-5-50-17" fill="none" stroke="#efbb8f" stroke-width="2" stroke-linecap="round"/></g>
            <path class="outline" d="m695 282 23-4 7 21-24 7Z" fill="#dfa278" stroke="#a77f59" stroke-width="2"/><path d="m704 282 7 19" stroke="#f2c69a" stroke-width="3"/><circle cx="701" cy="298" r="6" fill="#d69265" stroke="#a77f59" stroke-width="1.5"/>
            <g id="near-wing"><path class="outline" d="M600 343c11-20 43-24 68-7 18 13 31 24 62 23l53-3q15 0 13 10-1 11-13 12l-53-5c-28 10-53 20-81 11-34-10-58-22-49-41Z" fill="url(#wing-gradient)" stroke-width="2.7"/><path d="M610 352q11 23 47 25m-41-35q13 23 39 25m-23-34q15 25 32 24m8-12q22 24 54 22" fill="none" stroke="#bdcdb5" stroke-width="2.3" stroke-linecap="round"/><path d="M780 359q-2 8 7 10m-14-10q-3 8 6 12" fill="none" stroke="#b6c6ad" stroke-width="2" stroke-linecap="round"/></g>
          </g>
          <g id="handlebar-bell" transform="translate(810 348)"><path d="M-9 3a9 9 0 0 1 18 0Z" fill="#e8c57c" stroke="#6d7658" stroke-width="2"/><path d="M-9 5H9m1-7 4-3" stroke="#6d7658" stroke-width="2" stroke-linecap="round"/><circle cx="0" cy="-5" r="2" fill="#f8e6ae"/></g>
          <g id="bell-rings" fill="none" stroke="#bd9657" stroke-width="2.5" stroke-linecap="round" opacity="0"><path d="M797 329q-11 6-11 17m-3-23q-14 9-14 23m58-19q9 6 9 16m-3-24q13 10 13 23"/></g>
          <g id="wind-lines" fill="none" stroke="#fff8e4" stroke-width="3" stroke-linecap="round"><path d="M448 346h48m-68 20h48m-34 24h24"/></g>
        </g>
      </svg>
      <div class="scene-badge"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 14s5-5 5-8A5 5 0 0 0 3 6c0 3 5 8 5 8Z" stroke="currentColor"/><circle cx="8" cy="6" r="1.5" stroke="currentColor"/></svg>海边小路 · 快乐环线</div>
      <button class="weather" id="weather" type="button" aria-label="切换到落日模式" aria-pressed="false" aria-keyshortcuts="D"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg><span id="weather-label">看一场日落</span></button>
      <div class="scene-caption"><span></span>不赶时间，只追海风</div>
      <div class="scene-stamp"><strong>Enjoy the little things.</strong><small>SEASIDE CYCLING / 01</small></div>
    </div>
    <div class="controls" role="group" aria-label="动画控制">
      <div class="play-area">
        <button class="play-button" id="play" type="button" aria-label="暂停动画" aria-pressed="false" aria-keyshortcuts="Space"><svg class="pause-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="3" height="12" rx="1"/><rect x="12" y="4" width="3" height="12" rx="1"/></svg><svg class="play-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="m6 3 11 7-11 7Z"/></svg></button>
        <div><div class="status-title" id="status-title">快乐骑行中</div><div class="status-subtitle" id="status-subtitle">风很轻，心情刚刚好</div></div>
      </div>
      <div class="speed-area"><label for="speed">骑行速度</label><input id="speed" type="range" min="0.5" max="2" step="0.1" value="1" aria-label="骑行速度" aria-valuetext="1 倍速度"><output id="speed-value" for="speed">1.0×</output></div>
      <button class="bell-button" id="bell" type="button" aria-label="按响车铃" aria-keyshortcuts="B"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 16c2-2 2-4 2-7a5 5 0 0 1 10 0c0 3 0 5 2 7H5Zm5 3a2 2 0 0 0 4 0M12 2V1"/></svg><span id="bell-label">叮铃，出发！</span></button>
    </div>
  </section>
  <footer class="footer"><span>把平常的日子，骑成小小的<em>好风景</em>。</span><div class="shortcuts"><span><kbd>SPACE</kbd>暂停 / 继续</span><span><kbd>B</kbd>车铃</span><span><kbd>D</kbd>日落</span></div></footer>
  <p class="sr-only" id="announcement" aria-live="polite" aria-atomic="true"></p>
</main>

<script>
(function pelicanAnimation() {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const stage = $('stage');
  const playButton = $('play');
  const speedInput = $('speed');
  const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
  const state = {
    time: 0,
    speed: Number(speedInput.value),
    paused: motionPreference.matches,
    sunset: false,
    bellLeft: 0,
    lastTimestamp: null,
    audio: null,
    rafId: null,
  };
  const parts = Object.fromEntries([
    'cloud-layer', 'wave-layer', 'garden-layer', 'road-layer', 'boat',
    'rear-spokes', 'front-spokes', 'crank-arms', 'far-leg', 'far-foot',
    'near-leg', 'near-leg-color', 'near-foot', 'rider-body', 'near-wing',
    'scarf-tail', 'eye', 'bike-shadow', 'wind-lines', 'handlebar-bell', 'bell-rings',
  ].map((id) => [id, $(id)]));
  const TAU = Math.PI * 2;
  const CRANK = { x: 660, y: 516, radius: 36 };
  const fmt = (n) => n.toFixed(2);
  const announce = (message) => { $('announcement').textContent = message; };

  function syncPlayState() {
    playButton.classList.toggle('is-paused', state.paused);
    playButton.setAttribute('aria-label', state.paused ? '继续动画' : '暂停动画');
    playButton.setAttribute('aria-pressed', String(state.paused));
    $('status-title').textContent = state.paused ? '停下来，看看海' : '快乐骑行中';
    $('status-subtitle').textContent = state.paused ? '风景不会走，随时再出发' : '风很轻，心情刚刚好';
  }

  function setPaused(paused, shouldAnnounce = true) {
    state.paused = paused;
    state.lastTimestamp = null;
    syncPlayState();
    if (shouldAnnounce) announce(paused ? '动画已暂停' : '动画继续播放');
    requestTick();
  }

  function setSpeed() {
    state.speed = Number(speedInput.value);
    $('speed-value').value = `${state.speed.toFixed(1)}×`;
    speedInput.style.setProperty('--progress', `${(state.speed - .5) / 1.5 * 100}%`);
    speedInput.setAttribute('aria-valuetext', `${state.speed.toFixed(1)} 倍速度`);
  }

  function toggleWeather() {
    state.sunset = !state.sunset;
    stage.classList.toggle('is-sunset', state.sunset);
    $('weather').setAttribute('aria-pressed', String(state.sunset));
    $('weather').setAttribute('aria-label', state.sunset ? '切换到晴天模式' : '切换到落日模式');
    $('weather-label').textContent = state.sunset ? '回到好天气' : '看一场日落';
    announce(state.sunset ? '已切换到落日模式' : '已切换到晴天模式');
  }

  // 两段式腿部逆运动学：膝盖自然弯曲，脚始终跟随踏板。
  function legPath(hipX, hipY, pedalX, pedalY) {
    const ankleX = pedalX - 7;
    const ankleY = pedalY - 8;
    const dx = ankleX - hipX;
    const dy = ankleY - hipY;
    const distance = Math.max(.001, Math.hypot(dx, dy));
    const upper = 77;
    const lower = 79;
    const reach = Math.min(distance, upper + lower - .001);
    const along = (upper * upper - lower * lower + reach * reach) / (2 * reach);
    const side = Math.sqrt(Math.max(0, upper * upper - along * along));
    const kneeX = hipX + dx / distance * along + dy / distance * side;
    const kneeY = hipY + dy / distance * along - dx / distance * side;
    return `M${fmt(hipX)} ${fmt(hipY)} L${fmt(kneeX)} ${fmt(kneeY)} L${fmt(ankleX)} ${fmt(ankleY)}`;
  }

  function render() {
    const t = state.time;
    const phase = t * TAU / 2.15 + .36;
    const rollingDistance = t * 153;
    const wheelDegrees = rollingDistance / 84 * 180 / Math.PI;
    const bob = Math.sin(phase * 2) * 1.65;
    const px = CRANK.x + Math.cos(phase) * CRANK.radius;
    const py = CRANK.y + Math.sin(phase) * CRANK.radius;
    const fx = CRANK.x - Math.cos(phase) * CRANK.radius;
    const fy = CRANK.y - Math.sin(phase) * CRANK.radius;

    parts['cloud-layer'].setAttribute('transform', `translate(${-((t * 9) % 1440)} 0)`);
    parts['wave-layer'].setAttribute('transform', `translate(${-((t * 25) % 480)} 0)`);
    parts['garden-layer'].setAttribute('transform', `translate(${-((t * 72) % 480)} 0)`);
    parts['road-layer'].setAttribute('transform', `translate(${-((t * 153) % 240)} 0)`);
    parts.boat.setAttribute('transform', `translate(${-((t * 3) % 1440)} ${Math.sin(t * 1.6) * 1.3})`);
    parts['rear-spokes'].setAttribute('transform', `rotate(${wheelDegrees % 360})`);
    parts['front-spokes'].setAttribute('transform', `rotate(${wheelDegrees % 360})`);
    parts['crank-arms'].setAttribute('transform', `rotate(${phase * 180 / Math.PI % 360})`);
    parts['far-leg'].setAttribute('d', legPath(628, 412 + bob, fx, fy));
    const nearLeg = legPath(645, 417 + bob, px, py);
    parts['near-leg'].setAttribute('d', nearLeg);
    parts['near-leg-color'].setAttribute('d', nearLeg);
    parts['far-foot'].setAttribute('transform', `translate(${fmt(fx)} ${fmt(fy)})`);
    parts['near-foot'].setAttribute('transform', `translate(${fmt(px)} ${fmt(py)})`);
    parts['rider-body'].setAttribute('transform', `translate(0 ${fmt(bob)})`);
    parts['near-wing'].setAttribute('transform', `rotate(${Math.sin(phase) * .65} 613 349)`);
    parts['scarf-tail'].setAttribute('transform', `translate(701 295) rotate(${Math.sin(t * 5.2) * 4.5})`);
    parts['bike-shadow'].setAttribute('rx', fmt(227 + Math.sin(phase * 2) * 3));
    parts['wind-lines'].setAttribute('opacity', fmt(.52 + Math.sin(t * 3) * .18));

    // 定时眨眼也使用同一个时钟，暂停时不会继续播放。
    const blinkTime = t % 5.4;
    const openness = blinkTime > 5.17 ? Math.max(.08, Math.abs(blinkTime - 5.285) / .115) : 1;
    parts.eye.setAttribute('transform', `translate(741 211) scale(1 ${Math.min(1, openness)})`);
    const ringing = state.bellLeft > 0;
    parts['bell-rings'].setAttribute('opacity', ringing ? fmt(Math.min(1, state.bellLeft * 2) * (.65 + .35 * Math.sin(state.bellLeft * 32) ** 2)) : '0');
    parts['handlebar-bell'].setAttribute('transform', `translate(810 348) rotate(${ringing ? Math.sin(state.bellLeft * 42) * 9 : 0})`);
  }

  // 静止时不空跑 RAF；后台页恢复时重置时间戳，避免画面突然跳动。
  function requestTick() {
    if (state.rafId === null && !document.hidden) state.rafId = requestAnimationFrame(tick);
  }

  function tick(timestamp) {
    state.rafId = null;
    const delta = state.lastTimestamp === null ? 0 : Math.min((timestamp - state.lastTimestamp) / 1000, .05);
    state.lastTimestamp = timestamp;
    if (!state.paused) state.time += delta * state.speed;
    if (state.bellLeft > 0) {
      state.bellLeft = Math.max(0, state.bellLeft - delta);
      if (state.bellLeft === 0) $('bell-label').textContent = '叮铃，出发！';
    }
    render();
    if (!state.paused || state.bellLeft > 0) requestTick();
  }

  async function ringBell() {
    state.bellLeft = .9;
    state.lastTimestamp = null;
    $('bell-label').textContent = '叮铃铃～';
    announce('叮铃，继续向快乐出发');
    requestTick();
    // 音频仅在用户主动点击后创建；静音环境下仍提供视觉反馈。
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      state.audio ??= new AudioContextClass();
      if (state.audio.state === 'suspended') await state.audio.resume();
      const start = state.audio.currentTime;
      [0, .16].forEach((delay) => {
        [1760, 2640, 3520].forEach((frequency, harmonic) => {
          const oscillator = state.audio.createOscillator();
          const gain = state.audio.createGain();
          oscillator.type = 'sine';
          oscillator.frequency.value = frequency;
          gain.gain.setValueAtTime(.0001, start + delay);
          gain.gain.exponentialRampToValueAtTime(.09 / (harmonic + 1), start + delay + .006);
          gain.gain.exponentialRampToValueAtTime(.0001, start + delay + .65);
          oscillator.connect(gain);
          gain.connect(state.audio.destination);
          oscillator.start(start + delay);
          oscillator.stop(start + delay + .7);
          oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
        });
      });
    } catch (_) { /* 浏览器禁用声音时不影响动画。 */ }
  }

  playButton.addEventListener('click', () => setPaused(!state.paused));
  speedInput.addEventListener('input', setSpeed);
  $('weather').addEventListener('click', toggleWeather);
  $('bell').addEventListener('click', ringBell);
  document.addEventListener('keydown', (event) => {
    if (event.repeat || event.ctrlKey || event.altKey || event.metaKey) return;
    if (event.target instanceof Element && event.target.closest('input, textarea, select, [contenteditable]')) return;
    if (event.code === 'Space') {
      if (event.target instanceof Element && event.target.closest('button, a')) return;
      event.preventDefault(); setPaused(!state.paused);
    }
    else if (event.code === 'KeyB') ringBell();
    else if (event.code === 'KeyD') toggleWeather();
  });
  document.addEventListener('visibilitychange', () => {
    state.lastTimestamp = null;
    if (document.hidden) {
      if (state.rafId !== null) cancelAnimationFrame(state.rafId);
      state.rafId = null;
    } else requestTick();
  });
  motionPreference.addEventListener('change', (event) => {
    if (event.matches) setPaused(true, false);
  });
  syncPlayState();
  setSpeed();
  render();
  requestTick();
})();
</script>
</body>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5e9">
  <title>鹈鹕的海边骑行</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #f5f5e9;
      color: #204f4a;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }
    .page {
      width: min(1240px, 100%);
      min-height: 100svh;
      margin: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px 28px;
    }
    .masthead, .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .masthead { padding: 0 2px 19px; }
    .identity { display: flex; align-items: center; gap: 10px; }
    .identity-mark { width: 27px; height: 27px; flex: none; }
    .identity strong { display: block; font-size: 14px; line-height: 1.15; }
    .identity small { display: block; margin-top: 4px; font: 9px/1.1 Georgia, serif; color: #71938b; }
    .edition { font: 11px Georgia, serif; color: #71938b; white-space: nowrap; }
    .artwork { position: relative; width: 100%; aspect-ratio: 12 / 7.5; overflow: hidden; background: #b9e3de; }
    .scene { display: block; width: 100%; height: 100%; }
    .footer { padding: 15px 2px 0; font-size: 10px; color: #78938b; }
    .footer strong { font-weight: 600; color: #416d60; }
    .ink { stroke: #254d49; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .thin-ink { stroke: #254d49; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    @media (max-width: 700px) {
      .page { padding: 18px 0; justify-content: center; }
      .masthead, .footer { padding-left: 18px; padding-right: 18px; }
      .masthead { padding-bottom: 14px; }
      .artwork { aspect-ratio: 1 / 1; }
      .footer { padding-top: 13px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div class="identity">
        <svg class="identity-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="15" fill="#da765d"/>
          <path d="M8 19c2-6 8-6 11-3l8 2-8 2c-1 5-8 7-11-1Z" fill="#fff8e9"/>
          <circle cx="18" cy="14" r="1.3" fill="#254d49"/>
          <path d="M20 19c2 4 5 4 7-1" fill="none" stroke="#f5b86d" stroke-width="2"/>
        </svg>
        <span><strong>海风骑行俱乐部</strong><small>PELICAN PEDAL CLUB</small></span>
      </div>
      <span class="edition">01 / COASTAL LOOP</span>
    </header>

    <div class="artwork">
      <svg class="scene" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="scene-title scene-description">
        <title id="scene-title">骑自行车的鹈鹕</title>
        <desc id="scene-description">一只白色鹈鹕戴着红围巾，骑珊瑚色自行车沿海岸前行。脚蹼踩动踏板，车轮旋转，云朵和路面徐徐后退。</desc>
        <defs>
          <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#b4dedc"/><stop offset="1" stop-color="#e4edcf"/></linearGradient>
          <linearGradient id="water" x2="0" y2="1"><stop stop-color="#83c7ba"/><stop offset="1" stop-color="#a9d4b9"/></linearGradient>
          <linearGradient id="road" x2="0" y2="1"><stop stop-color="#ecd4aa"/><stop offset="1" stop-color="#f7e8c6"/></linearGradient>
          <linearGradient id="body" x2=".85" y2="1"><stop stop-color="#fffdf1"/><stop offset="1" stop-color="#dae8dc"/></linearGradient>
          <linearGradient id="wing" x2="0" y2="1"><stop stop-color="#fffdf0"/><stop offset="1" stop-color="#d2e1d7"/></linearGradient>
          <linearGradient id="pouch" x2="0" y2="1"><stop stop-color="#f9c87c"/><stop offset="1" stop-color="#e79a67"/></linearGradient>
          <pattern id="basket" width="14" height="12" patternUnits="userSpaceOnUse">
            <rect width="14" height="12" fill="#c79662"/><path d="M0 3h14M0 9h14M4 0v12m7-12v12" stroke="#9c704a" stroke-width="1" opacity=".55"/>
          </pattern>
          <g id="cloud-shape" fill="#fffdf1"><ellipse cx="0" cy="11" rx="43" ry="16"/><circle cx="-19" cy="1" r="18"/><circle cx="5" cy="-9" r="25"/><circle cx="29" cy="3" r="19"/></g>
          <g id="spokes" stroke="#8ea89f" stroke-width="2.5">
            <path d="M0-88V88M-88 0H88M-62-62 62 62M62-62-62 62"/>
            <path d="M-34-81 34 81M34-81-34 81M-81-34 81 34M81-34-81 34" opacity=".5"/>
          </g>
          <g id="grass" fill="none" stroke="#78a881" stroke-width="3" stroke-linecap="round">
            <path d="M0 10Q-1-5-11-11M0 10Q6-12 13-16M0 10V-18"/>
          </g>
        </defs>

        <rect width="1200" height="750" fill="url(#sky)"/>
        <circle cx="975" cy="128" r="86" fill="#fff6ca" opacity=".22"/>
        <circle cx="975" cy="128" r="61" fill="#ffe09a"/>
        <circle cx="975" cy="128" r="72" fill="none" stroke="#fff5cd" stroke-width="2" opacity=".6"/>
        <g id="cloud-one"><use href="#cloud-shape"/></g>
        <g id="cloud-two" opacity=".75"><use href="#cloud-shape" transform="scale(.7)"/></g>
        <g id="cloud-three" opacity=".9"><use href="#cloud-shape" transform="scale(.85)"/></g>
        <path d="M0 371Q115 315 215 350T436 339Q568 300 699 351T940 340Q1088 311 1200 347V475H0Z" fill="#a0c6ae"/>
        <path d="M0 405Q148 380 294 411T577 394Q742 369 894 406T1200 390V487H0Z" fill="#91bda8"/>
        <rect x="0" y="426" width="1200" height="83" fill="url(#water)"/>
        <path d="M0 429H1200" stroke="#eaf2cf" stroke-width="3" opacity=".75"/>
        <g fill="none" stroke="#eaf5d9" stroke-width="3" stroke-linecap="round" opacity=".8">
          <path d="M71 451h57m30 27h83m91-30h37m45 34h97m73-27h64m105 23h76m71-24h56m77 29h71"/>
        </g>
        <path d="M0 470Q228 454 444 470T854 471Q1045 459 1200 468V750H0Z" fill="url(#road)"/>
        <path d="M0 472Q216 455 438 474T857 474Q1046 458 1200 472" fill="none" stroke="#729b74" stroke-width="17"/>
        <path d="M0 486Q220 468 440 486T860 485Q1042 471 1200 486" fill="none" stroke="#d9bd91" stroke-width="3"/>
        <g opacity=".78"><use href="#grass" x="87" y="480"/><use href="#grass" x="235" y="475" transform="translate(235 475) scale(.65) translate(-235 -475)"/><use href="#grass" x="1044" y="474"/><use href="#grass" x="1140" y="480"/></g>
        <g fill="#f4f4d2"><circle cx="145" cy="462" r="5"/><circle cx="152" cy="468" r="3"/><circle cx="1086" cy="457" r="5"/><circle cx="1092" cy="464" r="3"/></g>
        <g id="road-marks" fill="#fff4d8" opacity=".9">
          <rect x="-180" y="678" width="94" height="6" rx="3"/><rect x="0" y="678" width="94" height="6" rx="3"/>
          <rect x="180" y="678" width="94" height="6" rx="3"/><rect x="360" y="678" width="94" height="6" rx="3"/>
          <rect x="540" y="678" width="94" height="6" rx="3"/><rect x="720" y="678" width="94" height="6" rx="3"/>
          <rect x="900" y="678" width="94" height="6" rx="3"/><rect x="1080" y="678" width="94" height="6" rx="3"/>
          <rect x="1260" y="678" width="94" height="6" rx="3"/>
        </g>
        <ellipse cx="605" cy="638" rx="367" ry="25" fill="#9b8a73" opacity=".13"/>

        <!-- Wheels keep their tyres in place while the spokes rotate. -->
        <g fill="none">
          <circle cx="370" cy="525" r="104" stroke="#244c47" stroke-width="13"/>
          <circle cx="370" cy="525" r="91" stroke="#fbf7e6" stroke-width="5"/>
          <circle cx="850" cy="525" r="104" stroke="#244c47" stroke-width="13"/>
          <circle cx="850" cy="525" r="91" stroke="#fbf7e6" stroke-width="5"/>
        </g>
        <g id="rear-spokes" transform="translate(370 525)"><use href="#spokes"/></g>
        <g id="front-spokes" transform="translate(850 525)"><use href="#spokes"/></g>

        <path id="back-leg" d="M537 359 521 438 575 523" fill="none" stroke="#d89463" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
        <circle id="back-knee" cx="521" cy="438" r="9" fill="#e1a36b"/>
        <path id="back-foot" d="M-17-5Q-7-13 5-8L26-1Q18 8 5 9L-16 6Z" fill="#e4a46b" class="thin-ink"/>

        <!-- Coral frame and handlebars. -->
        <g fill="none" stroke="#d96754" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
          <path d="M370 525 520 372 575 523 370 525M520 372 735 380 575 523M735 380 850 525"/>
        </g>
        <path d="M520 372 512 346M493 349h57" fill="none" stroke="#254d49" stroke-width="8" stroke-linecap="round"/>
        <path d="M735 380 749 335q7-14 22-13h28" fill="none" stroke="#254d49" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M794 322h14" fill="none" stroke="#d96754" stroke-width="10" stroke-linecap="round"/>
        <circle cx="370" cy="525" r="11" fill="#f7ead2" class="ink"/>
        <circle cx="850" cy="525" r="11" fill="#f7ead2" class="ink"/>
        <path d="M731 386 838 526" fill="none" stroke="#f4a28a" stroke-width="3" opacity=".7"/>

        <!-- The basket carries a few flowers. -->
        <g transform="translate(781 341)">
          <path d="M-6 7Q-2-24 22-21T50 7" fill="none" stroke="#8f6c4d" stroke-width="5"/>
          <path d="M-16 1H61L52 70Q23 82-6 70Z" fill="url(#basket)" class="thin-ink"/>
          <path d="M-16 1H61" stroke="#855e41" stroke-width="7" stroke-linecap="round"/>
          <path d="M12 0Q6-16-3-21M24 0q1-28 17-38M42 0q9-19 17-20" fill="none" stroke="#628e6d" stroke-width="3" stroke-linecap="round"/>
          <circle cx="-4" cy="-23" r="7" fill="#f6e4a5"/><circle cx="42" cy="-39" r="8" fill="#d98770"/><circle cx="60" cy="-22" r="6" fill="#fff5d4"/>
          <circle cx="-4" cy="-23" r="2" fill="#dc9961"/><circle cx="42" cy="-39" r="2" fill="#f5dfad"/>
        </g>

        <!-- Pelican: tail, body, long neck, bill and pouch. -->
        <g id="bird">
          <g id="tail" transform="translate(480 319)">
            <path d="M0 0Q-55-9-88-49Q-81-13-48 13Q-83 14-105-8Q-82 36-29 38Z" fill="#dce9dd" class="ink"/>
            <path d="M-30 25q-40-6-62-24" fill="none" stroke="#b7d2c8" stroke-width="4" stroke-linecap="round"/>
          </g>
          <path d="M506 304Q487 275 499 235Q521 206 559 222Q604 242 623 300Q624 361 564 383Q499 393 461 349Q450 328 466 310Z" fill="url(#body)" class="ink"/>
          <path d="M568 300Q592 266 597 226Q598 178 639 159Q672 147 688 176Q693 199 669 217Q639 233 638 277Q641 317 614 341Z" fill="url(#body)" class="ink"/>
          <path d="M613 287Q619 229 645 208" fill="none" stroke="#d2e4d7" stroke-width="9" stroke-linecap="round" opacity=".75"/>
          <path d="M673 203Q724 221 817 207Q806 245 785 259Q728 275 686 220Z" fill="url(#pouch)" class="ink"/>
          <path d="M681 192Q758 193 845 204Q846 211 830 215Q752 219 680 207Z" fill="#f2b35e" class="ink"/>
          <path d="M697 216Q752 239 801 218" fill="none" stroke="#cf875e" stroke-width="3" stroke-linecap="round" opacity=".7"/>
          <circle cx="655" cy="177" r="5.5" fill="#244d49"/>
          <circle cx="657" cy="175" r="1.6" fill="#fffdf0"/>
          <path d="M642 160q13-8 27-2" fill="none" stroke="#5b7567" stroke-width="3" stroke-linecap="round"/>
          <path d="M628 164q-6-21 7-30m0 25q4-20 17-22" fill="none" stroke="#fdfbf0" stroke-width="11" stroke-linecap="round"/>
          <path d="M628 164q-6-21 7-30m0 25q4-20 17-22" fill="none" stroke="#254d49" stroke-width="3" stroke-linecap="round"/>
          <g id="scarf" transform="translate(610 259)">
            <path d="M-16-10Q0-19 26-13L32-1Q8 14-17 5Z" fill="#d96255" class="thin-ink"/>
            <path d="M-12 5Q-29 18-55 6Q-42 21-69 27Q-32 35-2 11Z" fill="#e27b61" class="thin-ink"/>
            <path d="M-21 13q-20 11-35 6" fill="none" stroke="#f6b38d" stroke-width="3" stroke-linecap="round"/>
          </g>
          <path d="M526 287Q564 275 596 301Q646 319 693 350Q710 360 730 339Q738 332 744 339Q739 357 712 367Q684 377 659 363Q624 343 581 335Q546 340 521 319Z" fill="url(#wing)" class="ink"/>
          <path d="M531 315q34 23 72 17m-53-40q44 33 86 35m-68-38q38 22 59 18" fill="none" stroke="#bed6cc" stroke-width="4" stroke-linecap="round"/>
          <path d="M718 347q13-10 23-7" fill="none" stroke="#d8e8dd" stroke-width="6" stroke-linecap="round"/>
        </g>

        <path id="front-leg" d="M565 365 644 439 575 523" fill="none" stroke="#e8aa70" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
        <circle id="front-knee" cx="644" cy="439" r="9" fill="#e8aa70"/>
        <g fill="none" stroke="#254d49" stroke-width="9" stroke-linecap="round">
          <line id="back-arm" x1="575" y1="523" x2="517" y2="523"/>
          <line id="front-arm" x1="575" y1="523" x2="633" y2="523"/>
        </g>
        <circle cx="575" cy="523" r="20" fill="#f8e8cc" class="ink"/>
        <circle cx="575" cy="523" r="7" fill="#d96754"/>
        <g id="back-pedal" fill="#254d49"><rect x="-21" y="-4" width="42" height="8" rx="4"/></g>
        <g id="front-pedal" fill="#254d49"><rect x="-21" y="-4" width="42" height="8" rx="4"/></g>
        <g id="front-foot"><path d="M-17-7Q-7-16 7-10L29-1Q22 10 6 11L-18 6Z" fill="#efb079" class="thin-ink"/><path d="M10 1 25 3" stroke="#d69466" stroke-width="2"/></g>

        <g fill="#8aab87" opacity=".75">
          <circle cx="106" cy="613" r="2"/><circle cx="154" cy="704" r="3"/><circle cx="1114" cy="611" r="2"/><circle cx="1042" cy="711" r="3"/>
        </g>
      </svg>
    </div>

    <footer class="footer"><strong>慢慢骑，沿着海风走。</strong><span>EST. 2026</span></footer>
  </main>

  <script>
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const $ = (id) => document.getElementById(id);
    const nodes = {
      rearSpokes: $('rear-spokes'), frontSpokes: $('front-spokes'), bird: $('bird'),
      scarf: $('scarf'), tail: $('tail'), road: $('road-marks'),
      backLeg: $('back-leg'), frontLeg: $('front-leg'),
      backKnee: $('back-knee'), frontKnee: $('front-knee'),
      backFoot: $('back-foot'), frontFoot: $('front-foot'),
      backArm: $('back-arm'), frontArm: $('front-arm'),
      backPedal: $('back-pedal'), frontPedal: $('front-pedal'),
      clouds: [
        { node: $('cloud-one'), x: 178, y: 145, speed: 12 },
        { node: $('cloud-two'), x: 550, y: 92, speed: 9 },
        { node: $('cloud-three'), x: 1075, y: 231, speed: 15 }
      ]
    };

    // Two equal limb segments meet at a knee that follows each pedal smoothly.
    function leg(hipX, hipY, footX, footY, side) {
      const dx = footX - hipX;
      const dy = footY - hipY;
      const distance = Math.max(1, Math.hypot(dx, dy));
      const length = 127;
      const midpoint = distance / 2;
      const bend = Math.sqrt(Math.max(0, length * length - midpoint * midpoint));
      const direction = side * bend / distance;
      return {
        x: hipX + dx / 2 + dy * direction,
        y: hipY + dy / 2 - dx * direction
      };
    }

    function animate(now) {
      const time = now / 1000;
      const phase = time * 5.1;
      const radius = 58;
      const spin = phase * 1.55 * 180 / Math.PI;
      const bob = Math.sin(phase * 2) * 2.8;
      const frontX = 575 + Math.cos(phase) * radius;
      const frontY = 523 + Math.sin(phase) * radius;
      const backX = 575 - Math.cos(phase) * radius;
      const backY = 523 - Math.sin(phase) * radius;
      const frontKnee = leg(565, 365 + bob, frontX, frontY, 1);
      const backKnee = leg(537, 359 + bob, backX, backY, -1);

      nodes.rearSpokes.setAttribute('transform', `translate(370 525) rotate(${spin})`);
      nodes.frontSpokes.setAttribute('transform', `translate(850 525) rotate(${spin})`);
      nodes.bird.setAttribute('transform', `translate(0 ${bob})`);
      nodes.scarf.setAttribute('transform', `translate(610 259) rotate(${Math.sin(phase * 1.3) * 5})`);
      nodes.tail.setAttribute('transform', `translate(480 319) rotate(${Math.sin(phase * 1.1) * 3})`);
      nodes.road.setAttribute('transform', `translate(${-((time * 165) % 180)} 0)`);

      nodes.frontLeg.setAttribute('d', `M565 ${365 + bob} L${frontKnee.x} ${frontKnee.y} L${frontX} ${frontY}`);
      nodes.backLeg.setAttribute('d', `M537 ${359 + bob} L${backKnee.x} ${backKnee.y} L${backX} ${backY}`);
      nodes.frontKnee.setAttribute('cx', frontKnee.x);
      nodes.frontKnee.setAttribute('cy', frontKnee.y);
      nodes.backKnee.setAttribute('cx', backKnee.x);
      nodes.backKnee.setAttribute('cy', backKnee.y);
      nodes.frontArm.setAttribute('x2', frontX);
      nodes.frontArm.setAttribute('y2', frontY);
      nodes.backArm.setAttribute('x2', backX);
      nodes.backArm.setAttribute('y2', backY);
      nodes.frontPedal.setAttribute('transform', `translate(${frontX} ${frontY})`);
      nodes.backPedal.setAttribute('transform', `translate(${backX} ${backY})`);
      nodes.frontFoot.setAttribute('transform', `translate(${frontX} ${frontY - 9})`);
      nodes.backFoot.setAttribute('transform', `translate(${backX} ${backY - 9})`);

      for (const cloud of nodes.clouds) {
        const x = ((cloud.x - time * cloud.speed + 180) % 1560 + 1560) % 1560 - 180;
        cloud.node.setAttribute('transform', `translate(${x} ${cloud.y})`);
      }
      if (!reducedMotion.matches) requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
    reducedMotion.addEventListener('change', (event) => {
      if (!event.matches) requestAnimationFrame(animate);
    });
  </script>
</body>
</html>

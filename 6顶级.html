<div class="scene-caption">TAKE THE SCENIC ROUTE.</div><div class="scene-number"><span id="distance">0.00</span> km OF HAPPINESS</div>
</div>
<div class="controls">
<div class="play-area"><button class="play-button" id="play" type="button" aria-label="暂停动画" aria-pressed="true"><svg class="pause-glyph" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="3" height="12" rx="1"/><rect x="12" y="4" width="3" height="12" rx="1"/></svg><svg class="play-glyph" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M6 3.5q0-1 1-.4l10 6q1 .8 0 1.5l-10 6q-1 .6-1-.5Z"/></svg></button><div><div class="play-title" id="play-label">正在兜风</div><div class="play-subtitle" id="play-subtitle">好心情，持续加载中</div></div></div>
<div class="speed-area"><label for="speed">骑行节奏</label><input id="speed" type="range" min="0.5" max="2" step="0.25" value="1" aria-valuetext="1 倍速度"><output class="speed-value" id="speed-value" for="speed">1.00×</output></div>

</div>
</section>
<footer class="footer"><span>风景不必赶路，快乐自有速度 <span class="heart">✳</span></span><span class="shortcuts"><span><kbd>Space</kbd> 暂停 / 继续</span><span><kbd>B</kbd> 响铃</span></span></footer>
<p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
<noscript><p>请启用 JavaScript，以播放踩踏、车轮转动和海岸滚动动画。</p></noscript>
</main>
<script>

(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const elements = Object.fromEntries([
    'stage', 'play', 'play-label', 'play-subtitle', 'speed', 'speed-value', 'weather',
    'weather-label', 'bell', 'bell-rings', 'bell-note', 'announcement', 'distance',
    'rear-spokes', 'front-spokes', 'crank', 'far-pedal', 'near-pedal',
    'far-foot', 'near-foot', 'far-leg', 'near-leg', 'far-leg-outline', 'near-leg-outline',
    'pelican', 'eye', 'scarf-tail', 'scarf-fold', 'cloud-track', 'coast-track',
    'ground-track', 'waves', 'roadDashes', 'sky-birds', 'bike-shadow', 'breeze'
  ].map((id) => [id, $(id)]));
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let playing = !reducedMotion.matches;
  let speed = 1;
  let elapsed = 0;
  let distance = 0;
  let previousTime = null;
  let frameId = null;
  let bellRemaining = 0;
  let audioContext = null;
  let lastDistanceText = '';
  const crankCenter = { x: 642, y: 448 };
  const crankRadius = 30;
  const wheelRadius = 83;
  const gearRatio = 1.55;
  const f = (value) => value.toFixed(2);

  // 两节腿的解析逆向运动学：从髋关节与脚踏位置求出膝盖。
  function legPath(hip, foot, upperLength = 67, lowerLength = 70) {
    const dx = foot.x - hip.x;
    const dy = foot.y - hip.y;
    const length = Math.max(0.001, Math.hypot(dx, dy));
    const along = (upperLength * upperLength - lowerLength * lowerLength + length * length) / (2 * length);
    const perpendicular = Math.sqrt(Math.max(0, upperLength * upperLength - along * along));
    const kneeX = hip.x + dx * along / length + dy * perpendicular / length;
    const kneeY = hip.y + dy * along / length - dx * perpendicular / length;
    return 'M' + f(hip.x) + ' ' + f(hip.y) + ' L' + f(kneeX) + ' ' + f(kneeY) + ' L' + f(foot.x) + ' ' + f(foot.y);
  }

  function drawScene(time) {
    const phase = time * 2.55 + 0.38;
    const degrees = phase * 180 / Math.PI;
    const bob = Math.sin(phase * 2) * 2.1;
    const wheelRotation = degrees * gearRatio;
    const groundDistance = time * 2.55 * gearRatio * wheelRadius;
    elements['rear-spokes'].setAttribute('transform', 'rotate(' + f(wheelRotation) + ')');
    elements['front-spokes'].setAttribute('transform', 'rotate(' + f(wheelRotation) + ')');
    elements.crank.setAttribute('transform', 'translate(642 448) rotate(' + f(degrees) + ')');
    elements.pelican.setAttribute('transform', 'translate(0 ' + f(bob) + ')');
    elements['bike-shadow'].setAttribute('rx', f(222 - bob * 1.2));

    for (const [name, angle, hip] of [
      ['near', phase, { x: 606, y: 352 + bob }],
      ['far', phase + Math.PI, { x: 624, y: 349 + bob }]
    ]) {
      const foot = { x: crankCenter.x + Math.cos(angle) * crankRadius, y: crankCenter.y + Math.sin(angle) * crankRadius };
      const transform = 'translate(' + f(foot.x) + ' ' + f(foot.y) + ')';
      elements[name + '-foot'].setAttribute('transform', transform);
      elements[name + '-pedal'].setAttribute('transform', transform);
      const path = legPath(hip, foot);
      elements[name + '-leg'].setAttribute('d', path);
      elements[name + '-leg-outline'].setAttribute('d', path);
    }

    const flutter = Math.sin(time * 5) * 6;
    const flutter2 = Math.cos(time * 4.1) * 4;
    elements['scarf-tail'].setAttribute('d', 'M678 253C645 ' + (242 + flutter2) + ' 620 ' + (246 - flutter) + ' 591 ' + (236 + flutter) + 'S548 ' + (231 + flutter2) + ' 526 ' + (246 + flutter) + 'L547 ' + (253 + flutter) + ' 533 ' + (264 + flutter) + 'C569 ' + (250 + flutter2) + ' 587 ' + (266 + flutter) + ' 616 ' + (267 - flutter) + 'S657 ' + (269 + flutter2) + ' 683 269Z');
    elements['scarf-fold'].setAttribute('d', 'M543 ' + (246 + flutter) + 'Q583 ' + (238 + flutter2) + ' 608 ' + (253 - flutter) + 'T670 259');
    const blinkCycle = time % 5.8;
    const blink = blinkCycle > 4.7 && blinkCycle < 4.86 ? Math.max(.08, Math.abs(blinkCycle - 4.78) / .08) : 1;
    elements.eye.setAttribute('transform', 'scale(1 ' + f(blink) + ')');
    elements['cloud-track'].setAttribute('transform', 'translate(' + (-((time * 8) % 1240)) + ' 0)');
    elements['coast-track'].setAttribute('transform', 'translate(' + (-((time * 19) % 1240)) + ' 0)');
    elements['ground-track'].setAttribute('transform', 'translate(' + (-(groundDistance % 1240)) + ' 0)');
    elements.waves.setAttribute('patternTransform', 'translate(' + (-((time * 27) % 210)) + ' 0)');
    elements.roadDashes.setAttribute('patternTransform', 'translate(' + (-(groundDistance % 156)) + ' 0)');
    elements['sky-birds'].setAttribute('transform', 'translate(' + (Math.sin(time * .24) * 26) + ' ' + (Math.sin(time * .65) * 5) + ')');
    elements.breeze.setAttribute('transform', 'translate(' + (Math.sin(time * 3) * 8) + ' 0)');
    elements.breeze.setAttribute('opacity', f(.45 + Math.sin(time * 2.3) * .18));
  }

  function drawBell() {
    const amount = Math.min(1, bellRemaining * 3);
    elements['bell-rings'].setAttribute('opacity', f(amount));
    elements['bell-note'].setAttribute('opacity', f(amount));
    const rise = reducedMotion.matches ? 0 : (1.6 - bellRemaining) * 8;
    elements['bell-note'].setAttribute('transform', 'translate(802 ' + f(279 - rise) + ')');
  }

  function scheduleFrame() {
    if (frameId === null && !document.hidden && (playing || bellRemaining > 0)) {
      frameId = window.requestAnimationFrame(tick);
    }
  }

  function tick(timestamp) {
    frameId = null;
    const delta = previousTime === null ? 0 : Math.min((timestamp - previousTime) / 1000, .05);
    previousTime = timestamp;
    if (playing) {
      elapsed += delta * speed;
      distance += delta * speed * 12 / 3600;
      drawScene(elapsed);
      const text = distance.toFixed(2);
      if (lastDistanceText !== text) {
        elements.distance.textContent = text;
        lastDistanceText = text;
      }
    }
    if (bellRemaining > 0) {
      bellRemaining = Math.max(0, bellRemaining - delta);
      drawBell();
    }
    if (!playing && bellRemaining === 0) previousTime = null;
    scheduleFrame();
  }

  function updatePlayState() {
    elements.play.classList.toggle('is-paused', !playing);
    elements.play.setAttribute('aria-label', playing ? '暂停动画' : '继续动画');
    elements.play.setAttribute('aria-pressed', String(playing));
    elements['play-label'].textContent = playing ? '正在兜风' : '歇一小会儿';
    elements['play-subtitle'].textContent = playing ? '好心情，持续加载中' : '风景会等你，不着急';
    previousTime = null;
    scheduleFrame();
  }

  function togglePlay() { playing = !playing; updatePlayState(); }

  // Web Audio 合成短铃声，不需要网络或音频文件，只在用户点击后播放。
  async function ringBell() {
    bellRemaining = 1.6;
    elements.announcement.textContent = '叮铃铃，让快乐先行！';
    if (!playing) previousTime = null;
    drawBell();
    scheduleFrame();
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      audioContext ??= new AudioContext();
      if (audioContext.state === 'suspended') await audioContext.resume();
      const now = audioContext.currentTime;
      for (const [offset, frequency] of [[0, 1568], [.14, 2093]]) {
        for (const [ratio, volume] of [[1, .09], [2.76, .019]]) {
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = 'sine';
          oscillator.frequency.value = frequency * ratio;
          gain.gain.setValueAtTime(0, now + offset);
          gain.gain.linearRampToValueAtTime(volume, now + offset + .006);
          gain.gain.exponentialRampToValueAtTime(.0001, now + offset + .75);
          oscillator.connect(gain); gain.connect(audioContext.destination);
          oscillator.start(now + offset); oscillator.stop(now + offset + .8);
          oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
        }
      }
    } catch (_) { /* 浏览器禁用声音时保留可视的车铃反馈。 */ }
  }

  elements.play.addEventListener('click', togglePlay);
  elements.bell.addEventListener('click', ringBell);
  elements.speed.addEventListener('input', (event) => {
    speed = Number(event.target.value);
    elements['speed-value'].textContent = speed.toFixed(2) + '×';
    elements.speed.setAttribute('aria-valuetext', speed + ' 倍速度');
    elements.speed.style.setProperty('--progress', ((speed - .5) / 1.5 * 100) + '%');
  });
  elements.weather.addEventListener('click', () => {
    const sunset = elements.stage.classList.toggle('sunset');
    elements['weather-label'].textContent = sunset ? '落日模式' : '晴空模式';
    elements.weather.setAttribute('aria-label', sunset ? '切换到晴空模式' : '切换到落日模式');
    elements.weather.setAttribute('aria-pressed', String(sunset));
  });
  document.addEventListener('keydown', (event) => {
    if (event.repeat || event.ctrlKey || event.metaKey || event.altKey || event.target.closest('input, button, textarea, select, [contenteditable]')) return;
    if (event.code === 'Space') { event.preventDefault(); togglePlay(); }
    if (event.code === 'KeyB') ringBell();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && frameId !== null) { cancelAnimationFrame(frameId); frameId = null; }
    previousTime = null;
    scheduleFrame();
  });
  reducedMotion.addEventListener('change', (event) => {
    if (event.matches) { playing = false; updatePlayState(); }
  });
  drawScene(0);
  updatePlayState();
})();
</script>

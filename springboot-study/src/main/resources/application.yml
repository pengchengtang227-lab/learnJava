# Spring Boot 读取此文件，自动创建数据源、连接池、事务管理器和 Web 容器。
server:
  address: 127.0.0.1
  port: 8080

spring:
  config:
    import:
      # 兼容在仓库根目录或 springboot-study 目录启动；本机密码文件不打包进 jar。
      - optional:file:./springboot-study/application-local.properties
      - optional:file:./application-local.properties
  application:
    name: springboot-study
  datasource:
    # 默认直接连接本地 MySQL，库需提前创建；真实密码由本地配置覆盖。
    # UPDATE 返回匹配行数，相同内容重复提交也视为成功。
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:springboot_study}?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&sslMode=DISABLED&connectTimeout=5000&socketTimeout=10000&useAffectedRows=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 表结构与演示数据统一交给 Flyway，避免两套初始化机制同时执行。
      mode: never
  flyway:
    locations: classpath:db/migration
    # 已有数据库首次接入时，核对结构后临时开启 baseline-on-migrate，详见 MYBATIS.md。
    # 以 0 为基线，让兼容已有表的 V1 也执行，补齐缺失的演示账户。
    baseline-version: 0
    baseline-on-migrate: false

# Mapper 接口上的 @Mapper 由 Starter 扫描；XML 中保存具体 SQL。
mybatis:
  mapper-locations: classpath:mapper/*.xml
  # 注册类型别名后，Mapper XML 中可直接使用 UserDO，无需写全限定类名。
  type-aliases-package: com.example.springstudy.model

# Starter 自动注册 PageInterceptor；仅在 Service 调用 startPage 后的查询上分页。
pagehelper:
  # 当前数据库是 MySQL，插件会将普通 SELECT 改写为带 LIMIT 的物理分页 SQL。
  helper-dialect: mysql
  # 超出总页数时返回空列表，保留请求页码，不自动跳回最后一页。
  reasonable: false
  # 不允许通过 pageSize=0 查询全部；接口另外限制每页 1～100 条。
  page-size-zero: false
  # 由 startPage 显式控制分页，避免普通 Mapper 参数意外触发分页。
  support-methods-arguments: false

# 启动后访问 /swagger-ui.html，在浏览器中填写参数并调用接口。
springdoc:
  # 仅展示本项目的业务接口，避免将框架提供的端点混入列表。
  packages-to-scan: com.example.springstudy.controller
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    doc-expansion: none
    # 展开接口后直接进入可填写状态，点击 Execute 即可发送请求。
    try-it-out-enabled: true
    disable-swagger-default-url: true

# Actuator 使用相同的本机地址和端口，访问路径默认为 /actuator。
management:
  endpoints:
    web:
      exposure:
        # 按需开放端点，便于学习健康检查、应用信息和运行指标。
        include: health,info,metrics
  endpoint:
    health:
      # 当前仅监听 127.0.0.1，展示数据库等检查详情；对外部署时应限制详情访问。
      show-details: always
  info:
    env:
      # 将下方 info.* 中显式配置的应用信息加入 /actuator/info 响应。
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Spring Boot 账户转账学习项目

logging:
  pattern:
    # 在日志级别后追加 RequestIdFilter 放进 MDC 的请求 ID；没有请求上下文时（如启动日志）显示为空。
    level: "%5p [%X{requestId:-}]"
  charset:
    # 显式使用 UTF-8，便于在 Windows 终端和 IDEA 中阅读中文日志。
    console: UTF-8
  level:
    com.example.springstudy: INFO
    # 学习时观察 Preparing、Parameters、Total，理解 SQL、参数绑定与结果数量。
    com.example.springstudy.mapper: DEBUG

# Spring Boot 读取此文件，自动创建数据源、连接池、事务管理器和 Web 容器。
server:
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: springboot-study
  datasource:
    # 内存数据库仅供学习：应用停止后数据消失，下次启动重新加载初始数据。
    url: jdbc:h2:mem:springstudy;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  sql:
    init:
      # 先执行 schema.sql 建表，再执行 data.sql 初始化演示账户。
      mode: always

# Actuator 使用相同的本机地址和端口，访问路径默认为 /actuator。
management:
  endpoints:
    web:
      exposure:
        # 按需开放端点，便于学习健康检查、应用信息和运行指标。
        include: health,info,metrics
  endpoint:
    health:
      # 当前仅监听 127.0.0.1，展示数据库等检查详情；对外部署时应限制详情访问。
      show-details: always
  info:
    env:
      # 将下方 info.* 中显式配置的应用信息加入 /actuator/info 响应。
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Spring Boot 账户转账学习项目

logging:
  pattern:
    # 在日志级别后追加 RequestIdFilter 放进 MDC 的请求 ID；没有请求上下文时（如启动日志）显示为空。
    level: "%5p [%X{requestId:-}]"
  charset:
    # 显式使用 UTF-8，便于在 Windows 终端和 IDEA 中阅读中文日志。
    console: UTF-8
  level:
    com.example.springstudy: INFO
